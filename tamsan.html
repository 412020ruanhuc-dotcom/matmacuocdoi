<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô Hình Tam Sản - Mật Mã Cuộc Đời (Tài Sản - Gia Sản - Di Sản)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        amberbrand: {
                            bg: '#fdfbf7',     /* Màu nền kem sáng dịu mắt */
                            card: '#ffffff',   /* Thẻ trắng thanh lịch */
                            accent: '#b45309', /* Màu hổ phách đậm rõ nét */
                            lightBg: '#f4f1ea' /* Viền kem đậm sang trọng */
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f4f1ea; }
        ::-webkit-scrollbar-thumb { background: #b45309; border-radius: 4px; }
        .gradient-text {
            background: linear-gradient(135deg, #b45309 0%, #d97706 50%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-[#fdfbf7] text-stone-800 font-sans min-h-screen flex flex-col selection:bg-amber-200 selection:text-amber-950">

    <!-- THANH ĐIỀU HƯỚNG TRÊN -->
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-stone-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="changeSection(0)">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-700 to-amber-500 flex items-center justify-center text-white font-black text-xl shadow-md shadow-amber-700/10">
                    <i class="fa-solid fa-shapes"></i>
                </div>
                <div>
                    <h1 class="font-serif font-bold text-lg leading-none gradient-text">MÔ HÌNH TAM SẢN</h1>
                    <p class="text-xs text-amber-700/80 font-medium">Kênh Mật Mã Cuộc Đời • matmacuocdoi.vn</p>
                </div>
            </div>
            <div>
                <button onclick="openSelfAssessment()" class="px-4 py-2 rounded-lg bg-amber-700 hover:bg-amber-600 text-xs font-semibold text-white transition flex items-center space-x-1.5 shadow-sm">
                    <i class="fa-solid fa-clipboard-question"></i>
                    <span>Tự Đánh Giá 3 Câu Hỏi</span>
                </button>
            </div>
        </div>
    </header>

    <!-- BỐ CỤC CHÍNH CỦA TRANG WEB -->
    <div class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 flex flex-col lg:flex-row gap-6">
        <!-- MỤC LỤC 23 PHẦN BÊN TRÁI -->
        <aside class="w-full lg:w-80 bg-white rounded-2xl border border-stone-200 p-4 flex flex-col shrink-0 max-h-[calc(100vh-6rem)] sticky top-20 shadow-sm">
            <div class="flex items-center justify-between mb-3 px-1">
                <span class="text-xs uppercase tracking-wider font-bold text-amber-700">Mục lục 23 Phần Chi Tiết</span>
                <span id="progressBadge" class="text-xs bg-stone-100 text-amber-800 px-2.5 py-0.5 rounded-full font-bold">1 / 23</span>
            </div>

            <!-- Hộp tìm kiếm -->
            <div class="relative mb-3">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-stone-400 text-xs"></i>
                <input type="text" id="searchInput" onkeyup="filterSections()" placeholder="Tìm nội dung phần..." class="w-full bg-stone-50 text-stone-800 placeholder-stone-400 text-xs rounded-xl pl-8 pr-3 py-2 border border-stone-200 focus:outline-none focus:border-amber-600 transition">
            </div>

            <!-- Danh sách 23 phần -->
            <div id="sectionNavList" class="flex-1 overflow-y-auto space-y-1.5 pr-1 text-xs">
                <!-- Hệ thống tự động kết xuất -->
            </div>

            <!-- Bộ nút bấm trước / sau -->
            <div class="mt-4 pt-3 border-t border-stone-100 flex items-center justify-between">
                <button onclick="prevSection()" id="prevBtn" class="px-3 py-1.5 rounded-lg bg-stone-100 hover:bg-stone-200 text-stone-600 disabled:opacity-40 disabled:cursor-not-allowed flex items-center space-x-1 transition">
                    <i class="fa-solid fa-chevron-left"></i>
                    <span>Trước</span>
                </button>
                <button onclick="nextSection()" id="nextBtn" class="px-3 py-1.5 rounded-lg bg-amber-700 hover:bg-amber-600 text-white font-bold flex items-center space-x-1 transition shadow-sm">
                    <span>Tiếp</span>
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        </aside>

        <!-- KHU VỰC HIỂN THỊ NỘI DUNG CHÍNH BÊN PHẢI -->
        <main class="flex-1 min-w-0 flex flex-col">
            <div class="bg-white border border-stone-200 rounded-2xl p-6 sm:p-8 flex-1 flex flex-col justify-between shadow-sm min-h-[500px]">
                
                <div>
                    <!-- Đầu mục lớn -->
                    <div id="sectionHeader" class="border-b border-stone-100 pb-4 mb-5">
                        <span id="contentBadge" class="text-[10px] uppercase tracking-wider font-extrabold px-2.5 py-1 rounded-md bg-amber-50 text-amber-800 border border-amber-200/60 inline-block mb-2">TỔNG QUAN CHI TIẾT</span>
                        <h2 id="contentTitle" class="font-serif font-bold text-2xl text-stone-900 leading-tight">Đang tải nội dung...</h2>
                    </div>

                    <!-- Phần chữ hiển thị nội dung cẩm nang -->
                    <div id="textContentContainer" class="text-stone-700 text-base leading-relaxed space-y-4 font-normal">
                        <!-- Chữ nghĩa hiển thị tại đây -->
                    </div>
                </div>

                <!-- BỘ PHẦN TỰ ĐÁNH GIÁ 3 CÂU HỎI -->
                <div id="assessmentModal" class="hidden mt-8 pt-6 border-t border-stone-200 bg-stone-50 p-6 rounded-xl border border-stone-200 shadow-inner">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-serif font-bold text-lg text-amber-800"><i class="fa-solid fa-star-of-life mr-2"></i>Công Cụ Tự Nhìn Nhận Tam Sản Cuộc Đời</h3>
                        <button onclick="closeSelfAssessment()" class="text-stone-400 hover:text-stone-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                    </div>
                    <form onsubmit="calculateTamSan(event)" class="space-y-4">
                        <div>
                            <label class="block text-sm font-semibold text-stone-700 mb-1">1. TÀI SẢN – Tôi đang có gì? (Nhập từ 1 đến 10)</label>
                            <input type="number" id="q1" min="1" max="10" required class="w-full bg-white border border-stone-300 rounded-lg p-2 text-sm focus:outline-none focus:border-amber-600">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-stone-700 mb-1">2. GIA SẢN – Gia định tôi đang có gì? (Nhập từ 1 đến 10)</label>
                            <input type="number" id="q2" min="1" max="10" required class="w-full bg-white border border-stone-300 rounded-lg p-2 text-sm focus:outline-none focus:border-amber-600">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-stone-700 mb-1">3. DI SẢN – Tôi sẽ để lại gì? (Nhập từ 1 đến 10)</label>
                            <input type="number" id="q3" min="1" max="10" required class="w-full bg-white border border-stone-300 rounded-lg p-2 text-sm focus:outline-none focus:border-amber-600">
                        </div>
                        <button type="submit" class="w-full bg-amber-700 hover:bg-amber-600 text-white font-bold py-2.5 rounded-lg text-sm transition shadow-sm">Phân Tích Cân Bằng Tam Sản Của Tôi</button>
                    </form>

                    <!-- Kết quả xử lý tính điểm -->
                    <div id="resultBox" class="hidden mt-4 p-4 rounded-lg border border-amber-200 bg-amber-50/50">
                        <h4 id="resultTitle" class="font-bold text-amber-900 text-sm mb-1"></h4>
                        <p id="resultDesc" class="text-stone-700 text-sm mb-2"></p>
                        <p id="resultAdvice" class="text-xs font-semibold text-amber-700 italic"></p>
                    </div>
                </div>

            </div>
        </main>
    </div>
    <!-- HỆ THỐNG DỮ LIỆU VÀ KỊCH BẢN ĐIỀU HƯỚNG JAVASCRIPT -->
    <script>
        // Mảng lưu trữ nội dung của 23 phần mục lục
        const sectionsData = [
            { id: 1, badge: "Tổng Quan", title: "1. Tam Sản Là Gì?", content: "Tam Sản là một mô hình tư duy dùng để nhìn nhận một cách toàn diện những giá trị mà một con người tạo dựng trong suốt cuộc đời. Đời người không chỉ được đo bằng những gì sở hữu, mà gồm ba đỉnh gắn kết mật thiết: TÀI SẢN (những gì ta có), GIA SẢN (những gì gia đình cùng xây dựng và gìn giữ), và DI SẢN (những gì ta để lại cho đời)." },
            { id: 2, badge: "Tài Sản", title: "2. Đỉnh Thứ Nhất: Tài Sản", content: "Tài sản là phần dễ nhìn thấy nhất, bao gồm tiền mặt, cổ phiếu, doanh nghiệp, nhà đất, phương tiện, hoặc quyền sở hữu trí tuệ... Bản chất tài sản là nguồn lực có thể sở hữu, sử dụng, bảo toàn hoặc phát triển để tạo ra giá trị kinh tế bền vững. Giá trị của nó nằm ở chu trình: Tạo ra – Bảo vệ – Phát triển – Chuyển giao." },
            { id: 3, badge: "Quản Trị", title: "3. Tài Sản Không Chỉ Là Tiền", content: "Không nên đồng nhất tài sản với tiền bạc. Một người có thể có tài sản vô hình cực kỳ quan trọng như kiến thức, kinh nghiệm, kỹ năng quản trị rủi ro, uy tín, thương hiệu cá nhân, hay năng lực tạo ra thu nhập lâu dài trong tương lai." },
            { id: 4, badge: "Gia Sản", title: "4. Bản Chất Chiều Sâu Của Gia Sản", content: "Gia sản không phải là số tiền để lại cho con cái. Gia sản là nền nếp văn hóa, gia phong, uy tín của dòng họ, kỹ năng làm ăn kinh doanh, tri thức nền tảng và tinh thần vượt khó được truyền tải đồng hành qua nhiều thế hệ một cách vững vàng." },
            { id: 5, badge: "Di Sản", title: "5. Bản Chất Cao Đẹp Của Di Sản", content: "Di sản trả lời cho câu hỏi lớn lao: 'Khi một con người không còn ở đây nữa, giá trị tốt đẹp nào của họ vẫn tiếp tục sống và lan tỏa cho đời?'. Di sản có thể là tư tưởng đạo đức, các công trình đóng góp, tri thức hoặc thế hệ sau được ta tận tâm đào tạo." }
        ];

        // Tự động tạo tiêu đề mẫu từ phần 6 đến phần 23 để chú không bị thiếu khung
        for (let i = 6; i <= 23; i++) {
            let labelTitle = "";
            if(i === 13) labelTitle = "13. Sai lầm của người chuẩn bị tích lũy";
            else if(i === 14) labelTitle = "14. Từ Tài Sản đến Gia Sản";
            else if(i === 15) labelTitle = "15. Từ Gia Sản đến Di Sản";
            else if(i === 19) labelTitle = "19. Một Tam Sản tốt phải có sự cân bằng";
            else if(i === 20) labelTitle = "20. Câu hỏi cốt lõi của Tam Sản";
            else if(i === 23) labelTitle = "23. Kết luận từ góc nhìn Giữ và Để Lại";
            else labelTitle = `${i}. Nghiên cứu chuyên sâu mô hình Tam Sản`;

            sectionsData.push({
                id: i,
                badge: `Phần ${i}`,
                title: labelTitle,
                content: `Nội dung chi tiết của phần số ${i} đang được cập nhật hệ thống dữ liệu. Chú có thể mở đoạn mã này để tự thay đổi chữ viết trực tiếp trong code rất dễ dàng.`
            });
        }

        let currentIdx = 0;

        function renderSidebar() {
            const listContainer = document.getElementById('sectionNavList');
            listContainer.innerHTML = '';
            sectionsData.forEach((sec, index) => {
                const isActive = index === currentIdx;
                const item = document.createElement('button');
                item.className = `w-full text-left px-3 py-2 rounded-xl transition flex items-center justify-between text-stone-700 ${isActive ? 'bg-amber-50 text-amber-900 font-bold border border-amber-200 shadow-sm' : 'hover:bg-stone-50'}`;
                item.onclick = () => changeSection(index);
                item.innerHTML = `<span class="truncate pr-2">${sec.title}</span><i class="fa-solid fa-chevron-right text-[10px] opacity-40 shrink-0"></i>`;
                listContainer.appendChild(item);
            });
            
            document.getElementById('progressBadge').innerText = `${currentIdx + 1} / 23`;
            document.getElementById('prevBtn').disabled = currentIdx === 0;
            document.getElementById('nextBtn').disabled = currentIdx === sectionsData.length - 1;
        }

        function renderContent() {
            const currentData = sectionsData[currentIdx];
            document.getElementById('contentBadge').innerText = currentData.badge;
            document.getElementById('contentTitle').innerText = currentData.title;
            document.getElementById('textContentContainer').innerText = currentData.content;
        }

        function changeSection(idx) {
            currentIdx = idx;
            renderSidebar();
            renderContent();
        }

        function nextSection() { if (currentIdx < sectionsData.length - 1) changeSection(currentIdx + 1); }
        function prevSection() { if (currentIdx > 0) changeSection(currentIdx - 1); }

        function filterSections() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const buttons = document.getElementById('sectionNavList').getElementsByTagName('button');
            sectionsData.forEach((sec, index) => {
                const isMatch = sec.title.toLowerCase().includes(query);
                buttons[index].style.display = isMatch ? 'flex' : 'none';
            });
        }

        function openSelfAssessment() {
            document.getElementById('assessmentModal').classList.remove('hidden');
            document.getElementById('assessmentModal').scrollIntoView({ behavior: 'smooth' });
        }

        function closeSelfAssessment() {
            document.getElementById('assessmentModal').classList.add('hidden');
        }

        function calculateTamSan(e) {
            e.preventDefault();
            const q1 = parseInt(document.getElementById('q1').value);
            const q2 = parseInt(document.getElementById('q2').value);
            const q3 = parseInt(document.getElementById('q3').value);

            const resultBox = document.getElementById('resultBox');
            const resultTitle = document.getElementById('resultTitle');
            const resultDesc = document.getElementById('resultDesc');
            const resultAdvice = document.getElementById('resultAdvice');

            resultBox.classList.remove('hidden');

            if (q1 > q2 && q1 > q3) {
                resultTitle.innerText = "Trạng Thái: Tập Trung Nhiều Về Tài Sản Cá Nhân";
                resultDesc.innerText = "Bạn có khả năng kiếm tiền và tạo nguồn lực tốt, nhưng cần chú ý nâng cấp nền nếp gia phong.";
                resultAdvice.innerText = "Khuyên dùng: Đọc kỹ Phần 13 & Phần 14 trong ứng dụng để tránh bẫy lệch chuẩn.";
            } else if (q2 >= q1 && q2 >= q3) {
                resultTitle.innerText = "Trạng Thái: Nền Tảng Gia Phong Vững Vàng";
                resultDesc.innerText = "Gia đình bạn có sự gắn kết và nền nếp rất tốt. Đây là móng nhà vững chãi để bứt phá.";
                resultAdvice.innerText = "Khuyên dùng: Tham khảo Phần 15 để đưa Gia sản vươn tầm thành Di sản cộng đồng.";
            } else if (q3 >= q1 && q3 >= q2) {
                resultTitle.innerText = "Trạng Thái: Hướng Tới Giá Trị Nhân Sinh Lâu Dài";
                resultDesc.innerText = "Bạn có tâm thế phụng sự và quan tâm đến những điều còn lại sau sinh mệnh. Hãy bảo đảm nguồn lực vững vàng.";
                resultAdvice.innerText = "Khuyên dùng: Đọc lại Phần 19 & Phần 23 về Vòng Tuần Hoàn Tam Sản Cân Bằng.";
            } else {
                resultTitle.innerText = "Trạng Thái: Tam Sản Đang Trong Tiến Trình Tích Lũy";
                resultDesc.innerText = "Bạn đang ở những bước đầu của hành trình tạo dựng cuộc đời. Hãy kiên trì bồi đắp cả 3 tầng giá trị.";
                resultAdvice.innerText = "Khuyên dùng: Thực hành 3 câu hỏi cốt lõi ở Phần 20 hàng tuần.";
            }
        }

        window.onload = () => {
            changeSection(0);
        };
    </script>
</body>
</html>
