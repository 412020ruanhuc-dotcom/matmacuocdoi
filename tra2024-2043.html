<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Hạn Chuẩn 100% - Update 2026</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        body { background-color: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .main-card { background: white; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); border-top: 8px solid #b91c1c; }
        .han-box { border-radius: 12px; padding: 16px; border: 1px solid #e2e8f0; background: #fff; height: 100%; display: flex; flex-direction: column; justify-content: center; }
        .bad-news { color: #dc2626; font-weight: 800; }
        .good-news { color: #059669; font-weight: 800; }
        .label-title { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: #64748b; margin-bottom: 4px; display: block; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="main-card w-full max-w-xl p-6 md:p-10">
        <!-- ĐÃ GẮN ID ĐỂ TỰ ĐỘNG ĐỔI TIÊU ĐỀ THEO NĂM XEM HẠN -->
        <h2 id="mainTitle" class="text-3xl font-black text-center text-red-800 mb-2 uppercase">Tra Cứu Hạn 2026</h2>
        <p class="text-center text-gray-500 text-sm mb-6 font-semibold italic">Dữ liệu Sao-Hạn theo bảng chuẩn & Logic Tứ Đại Hạn</p>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Năm sinh (Dương lịch):</label>
                <input type="number" id="birthYear" value="1984" class="w-full px-4 py-3 border-2 rounded-xl focus:ring-2 focus:ring-red-500 outline-none text-center font-bold text-lg">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Năm xem hạn:</label>
                <!-- MỞ KHÓA: Đã bỏ thuộc tính khóa readonly và bỏ màu nền xám để chú nhập tự do -->
                <input type="number" id="currentYear" value="2026" class="w-full px-4 py-3 border-2 rounded-xl focus:ring-2 focus:ring-red-500 outline-none text-center font-bold text-lg">
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm font-bold text-gray-700 mb-1">Giới tính:</label>
                <select id="gender" class="w-full px-4 py-3 border-2 rounded-xl font-bold bg-white outline-none">
                    <option value="nam">Nam mạng</option>
                    <option value="nu">Nữ mạng</option>
                </select>
            </div>
        </div>

        <button onclick="calculate()" class="w-full bg-red-700 hover:bg-red-800 text-white font-black py-4 rounded-xl shadow-lg transition duration-300 uppercase text-lg mb-8">
            Xem Kết Quả Chuẩn
        </button>

        <div id="resultArea" class="hidden space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div class="han-box bg-blue-50">
                    <span class="label-title">Sao Chiếu Mệnh</span>
                    <p id="resSao" class="text-xl font-black text-blue-900"></p>
                </div>
                <div class="han-box bg-orange-50">
                    <span class="label-title">Hạn Niên</span>
                    <p id="resHanNien" class="text-xl font-black text-orange-900"></p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="han-box">
                    <span class="label-title">Tam Tai</span>
                    <p id="resTamTai" class="text-lg"></p>
                </div>
                <div class="han-box">
                    <span class="label-title">Thái Tuế</span>
                    <p id="resThaiTue" class="text-lg"></p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="han-box">
                    <span class="label-title">Kim Lâu</span>
                    <p id="resKimLau" class="text-lg"></p>
                </div>
                <div class="han-box">
                    <span class="label-title">Hoang Ốc</span>
                    <p id="resHoangOc" class="text-lg"></p>
                </div>
            </div>

            <div class="p-4 bg-gray-900 text-white rounded-xl text-center">
                <p id="resTuoiMu" class="text-2xl font-black text-yellow-400"></p>
                <p id="resCanChi" class="text-sm font-bold text-gray-400 uppercase tracking-widest mt-1"></p>
            </div>
        </div>
    </div>
<script>
        // MẢNG CHU KỲ SAO HẠN TỰ ĐỘNG (Thay thế hoàn toàn cho DATA_2026 tĩnh)
        const saoNam = ["La Hầu", "Thổ Tú", "Thủy Diệu", "Thái Bạch", "Thái Dương", "Vân Hớn", "Kế Đô", "Thái Âm", "Mộc Đức"];
        const saoNu  = ["Kế Đô", "Vân Hớn", "Mộc Đức", "Thái Âm", "Thổ Tú", "La Hầu", "Thái Dương", "Thái Bạch", "Thủy Diệu"];
        const hanNam = ["Tam Kheo", "Ngũ Mộ", "Thiên Tinh", "Huỳnh Tuyền", "Toán Tận", "Thiên La", "Địa Võng", "Diêm Vương"];
        const hanNu  = ["Thiên Tinh", "Ngũ Mộ", "Tam Kheo", "Toán Tận", "Huỳnh Tuyền", "Diêm Vương", "Địa Võng", "Thiên La"];

        const chiNames = ["Tý", "Sửu", "Dần", "Mão", "Thìn", "Tỵ", "Ngọ", "Mùi", "Thân", "Dậu", "Tuất", "Hợi"];
        const canNames = ["Canh", "Tân", "Nhâm", "Quý", "Giáp", "Ất", "Bính", "Đinh", "Mậu", "Kỷ"];

        function calculate() {
            const birthYear = parseInt(document.getElementById('birthYear').value);
            // MỞ KHÓA VĨNH VIỄN: Lấy giá trị năm xem trực tiếp từ ô nhập currentYear thay vì gán cứng 2026
            const currentYear = parseInt(document.getElementById('currentYear').value) || 2026;
            const gender = document.getElementById('gender').value;
            const tuoiMu = currentYear - birthYear + 1;

            if (!birthYear || birthYear > currentYear) {
                alert("Vui lòng nhập năm sinh hợp lệ!");
                return;
            }

            // Tự động cập nhật dòng tiêu đề lớn h2 theo năm đang xem hạn cho chuyên nghiệp
            document.getElementById('mainTitle').innerText = "Tra Cứu Hạn " + currentYear;

            // 1. TUỔI MỤ & CAN CHI (Tính tự động chính xác)
            document.getElementById('resTuoiMu').innerText = tuoiMu + " Tuổi Mụ";
            const can = canNames[birthYear % 10];
            const chiIndex = (birthYear - 4) % 12;
            const chi = chiNames[chiIndex < 0 ? chiIndex + 12 : chiIndex];
            document.getElementById('resCanChi').innerText = can + " " + chi;

            // 2. SAO & HẠN TỰ ĐỘNG CHU KỲ (Chuẩn xác 100% thay cho bảng tra cứu tĩnh)
            let chiSoSao = (tuoiMu - 10) % 9; if (chiSoSao < 0) chiSoSao += 9;
            let chiSoHan = (tuoiMu - 10) % 8; if (chiSoHan < 0) chiSoHan += 8;

            let textSao = (gender === 'nam') ? "S. " + saoNam[chiSoSao] : "S. " + saoNu[chiSoSao];
            let textHan = (gender === 'nam') ? "H. " + hanNam[chiSoHan] : "H. " + hanNu[chiSoHan];

            // Nếu nhỏ hơn 10 tuổi mụ thì hệ thống Cửu Diệu chưa tính sao hạn niên
            if (tuoiMu < 10) { textSao = "Chưa tính"; textHan = "Chưa tính"; }
            
            document.getElementById('resSao').innerText = textSao;
            document.getElementById('resHanNien').innerText = textHan;
            // Xác định Địa chi của năm xem hạn để tự động hóa hoàn toàn
            const currentChiIndex = (currentYear - 4) % 12;
            const currentChi = chiNames[currentChiIndex < 0 ? currentChiIndex + 12 : currentChiIndex];

            // 3. TAM TAI TỰ ĐỘNG LINH HOẠT THEO NĂM XEM HẠN
            const boTamTai = {
                "Thân": ["Dần", "Mão", "Thìn"], "Tý": ["Dần", "Mão", "Thìn"], "Thìn": ["Dần", "Mão", "Thìn"],
                "Dần": ["Thân", "Dậu", "Tuất"], "Ngọ": ["Thân", "Dậu", "Tuất"], "Tuất": ["Thân", "Dậu", "Tuất"],
                "Hợi": ["Tỵ", "Ngọ", "Mùi"], "Mão": ["Tỵ", "Ngọ", "Mùi"], "Mùi": ["Tỵ", "Ngọ", "Mùi"],
                "Tỵ": ["Hợi", "Tý", "Sửu"], "Sửu": ["Hợi", "Tý", "Sửu"], "Dậu": ["Hợi", "Tý", "Sửu"]
            };
            
            let ttText = "Không phạm";
            let ttClass = "good-news";
            const namHanCuaTuoi = boTamTai[chi] || [];
            
            if (namHanCuaTuoi.includes(currentChi)) {
                let namThu = namHanCuaTuoi.indexOf(currentChi) + 1;
                ttText = `Phạm Tam Tai (Năm ${namThu})`;
                ttClass = "bad-news";
            }
            document.getElementById('resTamTai').innerText = ttText;
            document.getElementById('resTamTai').className = "text-lg " + ttClass;

            // 4. THÁI TUẾ TỰ ĐỘNG THEO CHU KỲ ĐỐI XUNG ĐỊA CHI
            let thText = "Không phạm";
            let diff = (chiNames.indexOf(currentChi) - chiNames.indexOf(chi) + 12) % 12;
            
            if (diff === 0) thText = "Trực Thái Tuế";
            else if (diff === 6) thText = "Xung Thái Tuế";
            else if (diff === 3 || diff === 9) thText = "Hình Thái Tuế";
            else if (diff === 5 || diff === 7) thText = "Hại Thái Tuế";
            
            document.getElementById('resThaiTue').innerText = thText;
            document.getElementById('resThaiTue').className = "text-lg " + (thText === "Không phạm" ? "good-news" : "bad-news");

            // 5. KIM LÂU (Logic chuẩn gốc của chú)
            const klDu = tuoiMu % 9;
            let klText = "Không phạm";
            if ([1, 3, 6, 8].includes(klDu) && tuoiMu > 10) {
                const types = {1:"Thân", 3:"Thê", 6:"Tử", 8:"Súc"};
                klText = "Phạm Kim Lâu " + types[klDu];
                document.getElementById('resKimLau').className = "text-lg bad-news";
            } else {
                document.getElementById('resKimLau').className = "text-lg good-news";
            }
            document.getElementById('resKimLau').innerText = klText;

            // 6. HOANG ỐC (Logic gốc của chú và đồng bộ màu hiển thị tốt/xấu)
            const hoLabels = ["1. Nhất Cát (Tốt)", "2. Nhì Nghi (Tốt)", "3. Tam Địa Sát (Xấu)", "4. Tứ Tấn Tài (Tốt)", "5. Ngũ Thọ Tử (Xấu)", "6. Lục Hoang Ốc (Xấu)"];
            let chuc = Math.floor(tuoiMu / 10);
            let donvi = tuoiMu % 10;
            let hoIdx = (chuc + donvi - 1) % 6;
            if (donvi === 0) hoIdx = (chuc - 1) % 6;
            if (tuoiMu < 10) hoIdx = (tuoiMu - 1) % 6;

            document.getElementById('resHoangOc').innerText = hoLabels[hoIdx];
            // Các nhóm chỉ số 2 (Tam Địa Sát), 4 (Ngũ Thọ Tử), 5 (Lục Hoang Ốc) là Xấu -> Hiện màu bad-news đỏ đô
            document.getElementById('resHoangOc').className = "text-lg " + ([2, 4, 5].includes(hoIdx) ? "bad-news" : "good-news");

            document.getElementById('resultArea').classList.remove('hidden');
        }
    </script>
</body>
</html>
