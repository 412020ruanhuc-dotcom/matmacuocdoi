<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mật Mã Cuộc Đời - Tử Vi Tuổi Sửu 2027</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2canvas cho tính năng in/xuất ảnh -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400&family=Roboto:wght@400;500;700;900&display=swap');

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #eaddca; /* Tone màu kem ngà sang trọng cổ điển */
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
        }

        .serif-font {
            font-family: 'Merriweather', serif;
        }

        /* Khung chứa tổng thể 16:9 full viewport */
        .app-viewport {
            width: 100vw;
            height: 100vh;
            display: flex;
            padding: 16px;
            gap: 16px;
            box-sizing: border-box;
            background-color: #ece3d4;
        }

        /* KHU VỰC TRÌNH CHIẾU BÊN TRÁI - Thu gọn tỉ lệ chuẩn 16:9 */
        .slide-stage-container {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            max-width: calc(100vw - 380px);
        }

        /* KHUNG SLIDE THU VUÔNG GỌN, VIỀN NỔI SANG TRỌNG */
        .slide-card-main {
            background-color: #fdfbf7;
            border: 3px solid #b89b72;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
            height: calc(100% - 65px);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Canvas cho nét vẽ mượt mà */
        #drawingCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            cursor: crosshair;
        }

        /* Lớp chứa ảnh & chữ tương tác */
        #interactiveElementsLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 25;
            pointer-events: none;
        }

        /* KHU VỰC BÊN PHẢI: KHUNG ĐỂ MẶT NGƯỜI NÓI (OBS) + BẢNG CÔNG CỤ */
        .sidebar-right {
            width: 360px;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Khung hình ảnh người nói (Cam OBS) */
        .obs-avatar-zone {
            height: 230px;
            border: 3px dashed #a38257;
            border-radius: 16px;
            background-color: #f5eee4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #8c6d3f;
            text-align: center;
            padding: 10px;
        }

        /* Bảng công cụ điều khiển */
        .tools-control-panel {
            flex: 1;
            background-color: #fdfbf7;
            border: 2px solid #c8b496;
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            overflow-y: auto;
        }

        .btn-custom {
            transition: all 0.15s ease;
        }
        .btn-custom:hover {
            transform: translateY(-1px);
            filter: brightness(1.05);
        }

        .color-dot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: transform 0.2s;
        }
        .color-dot.active {
            border-color: #000;
            transform: scale(1.2);
        }

        /* Phần tử có thể kéo thả & co giãn (Resizable / Draggable) */
        .resizable-wrapper {
            position: absolute;
            pointer-events: auto;
            cursor: move;
            display: inline-block;
            border: 2px dashed #b89b72;
            padding: 4px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        
        .resize-handle {
            width: 14px;
            height: 14px;
            background: #8b0000;
            position: absolute;
            right: -6px;
            bottom: -6px;
            cursor: se-resize;
            border-radius: 50%;
            border: 2px solid #fff;
        }

        .delete-btn {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #dc2626;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="app-viewport">
        <!-- KHU VỰC BÊN TRÁI: SLIDE BÀI GIẢNG (16:9 CHUẨN ĐÚNG YÊU CẦU) -->
        <div class="slide-stage-container">
            
            <!-- TIÊU ĐỀ SLIDE - ĐẬM ĐÀ, TO RÕ -->
            <div class="text-center py-1 bg-amber-100/80 rounded-xl border border-amber-300">
                <h1 class="text-2xl font-black text-red-950 tracking-wide serif-font">
                    MẬT MÃ CUỘC ĐỜI - TỬ VI TUỔI SỬU NĂM ĐINH MÙI (2027)
                </h1>
                <p class="text-xs font-bold text-amber-900 tracking-widest uppercase mt-0.8">
                    (ZALO: 0789.414.153 - XEM VẬN HẠN & CHẮP CÁNH BÌNH AN)
                </p>
            </div>

            <!-- NỘI DUNG CHÍNH CỦA SLIDE -->
            <div class="slide-card-main" id="slideCardContent">
                
                <!-- Canvas vẽ tay -->
                <canvas id="drawingCanvas"></canvas>

                <!-- Lớp tương tác chèn ảnh & chữ có thể co giãn to nhỏ -->
                <div id="interactiveElementsLayer"></div>

                <!-- Chữ nội dung slide -->
                <div id="slideInnerHtml" class="p-8 h-full flex flex-col justify-between overflow-y-auto relative z-10">
                    <!-- NỘI DUNG CÁC TRANG CẬP NHẬT TẠI ĐÂY -->
                </div>
            </div>

            <!-- THANH CHUYỂN TRANG -->
            <div class="flex justify-between items-center px-6 py-2 bg-amber-100/90 rounded-xl border border-amber-300 shadow-sm">
                <button onclick="prevSlide()" class="btn-custom bg-amber-800 hover:bg-amber-900 text-white font-extrabold px-6 py-2 rounded-lg flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-chevron-left"></i> Trang trước
                </button>
                
                <div class="text-base font-black text-red-950 serif-font" id="pageIndicator">
                    Trang 1 / 12
                </div>

                <button onclick="nextSlide()" class="btn-custom bg-red-900 hover:bg-red-950 text-white font-extrabold px-6 py-2 rounded-lg flex items-center gap-2 text-sm">
                    Trang sau <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        </div>

        <!-- KHU VỰC BÊN PHẢI: KHUNG ĐỂ ẢNH NGƯỜI NÓI (OBS) + BẢNG CÔNG CỤ -->
        <div class="sidebar-right">
            
            <!-- 1. KHUNG CHỜ ĐẶT KHÁM ẢNH NGƯỜI NÓI (OBS) -->
            <div class="obs-avatar-zone shadow-sm">
                <i class="fa-solid fa-circle-user text-5xl mb-2 text-amber-800/60"></i>
                <span class="text-base font-black text-red-950 uppercase tracking-wide">XIN CHÀO</span>
                <span class="text-xs text-amber-900/90 font-medium mt-1">TRAO GIÁ TRỊ</span>
            </div>

            <!-- 2. BẢNG CÔNG CỤ ĐIỀU KHIỂN & CHÈN NỘI DUNG -->
            <div class="tools-control-panel">
                <h2 class="text-sm font-black text-red-950 border-b border-amber-200 pb-2 flex items-center gap-2 uppercase">
                    <i class="fa-solid fa-toolbox text-amber-800"></i> HỘP KỸ THUẬT
                </h2>

                <!-- CHẾ ĐỘ THAO TÁC -->
                <div class="grid grid-cols-2 gap-2">
                    <button id="btnToolClick" onclick="setMode('click')" class="py-2 px-3 rounded-lg border border-amber-400 bg-amber-700 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm">
                        <i class="fa-solid fa-arrow-pointer"></i> Chuột bấm
                    </button>
                    <button id="btnToolDraw" onclick="setMode('draw')" class="py-2 px-3 rounded-lg border border-amber-400 bg-white text-gray-800 font-bold text-xs flex items-center justify-center gap-1.5 hover:bg-amber-50">
                        <i class="fa-solid fa-pen-nib"></i> Bút vẽ
                    </button>
                </div>

                <!-- CHỌN MÀU BÚT VẼ -->
                <div class="bg-amber-50/80 p-2 rounded-lg border border-amber-200">
                    <label class="text-xs font-bold text-amber-950 block mb-1">Màu nét bút:</label>
                    <div class="flex items-center justify-between">
                        <div class="color-dot bg-red-600 active" onclick="setColor('#dc2626', this)"></div>
                        <div class="color-dot bg-blue-600" onclick="setColor('#2563eb', this)"></div>
                        <div class="color-dot bg-yellow-500" onclick="setColor('#eab308', this)"></div>
                        <div class="color-dot bg-black" onclick="setColor('#000000', this)"></div>
                        <div class="color-dot bg-green-600" onclick="setColor('#16a34a', this)"></div>
                    </div>
                </div>

                <!-- ĐỘ DÀY NÉT BÚT VẼ -->
                <div class="bg-amber-50/80 p-2 rounded-lg border border-amber-200">
                    <div class="flex justify-between text-xs font-bold text-amber-950 mb-1">
                        <span>Cỡ bút vẽ:</span>
                        <span id="brushSizeVal">4px</span>
                    </div>
                    <input type="range" id="brushSize" min="1" max="15" value="4" oninput="changeBrushSize(this.value)" class="w-full accent-red-800 cursor-pointer">
                </div>

                <!-- THÊM CHỮ & CHÈN ẢNH TÙY CHỈNH KÍCH THƯỚC -->
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="addTextToSlide()" class="btn-custom py-2 px-2 bg-amber-200 hover:bg-amber-300 text-amber-950 border border-amber-400 rounded-lg font-bold text-xs flex items-center justify-center gap-1">
                        <i class="fa-solid fa-font"></i> Thêm Chữ
                    </button>
                    
                    <label class="btn-custom py-2 px-2 bg-amber-200 hover:bg-amber-300 text-amber-950 border border-amber-400 rounded-lg font-bold text-xs flex items-center justify-center gap-1 cursor-pointer text-center">
                        <i class="fa-solid fa-image"></i> Thêm Ảnh
                        <input type="file" id="imageUploader" accept="image/*" onchange="addImageToSlide(event)" class="hidden">
                    </label>
                </div>

                <!-- XÓA TẤT CẢ NÉT VẼ -->
                <button onclick="clearCanvas()" class="btn-custom w-full py-2 bg-gray-800 hover:bg-black text-white font-bold text-xs rounded-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-eraser"></i> Xóa Nét Vẽ
                </button>

                <!-- NÚT IN / LƯU ẢNH SLIDE NÀY -->
                <div class="mt-auto pt-2 border-t border-amber-200">
                    <button onclick="exportSlideAsImage()" class="btn-custom w-full py-3 bg-red-900 hover:bg-red-950 text-white font-black text-sm rounded-xl flex items-center justify-center gap-2 shadow-md">
                        <i class="fa-solid fa-print"></i> IN / TẢI ẢNH SLIDE NÀY
                    </button>
                </div>
            </div>
        </div>
    </div>

        let currentSlideIndex = 0;

        function resizeCanvas() {

                </div>
            `;

            document.getElementById('pageIndicator').innerText = `Trang ${index + 1} / ${slideData.length}`;

        function prevSlide() {
            if (currentSlideIndex > 0) {
                currentSlideIndex--;
                renderSlide(currentSlideIndex);
            }
        }

            if (currentSlideIndex < slideData.length - 1) {
                currentSlideIndex++;
                renderSlide(currentSlideIndex);
            }
        }

        function setMode(mode) {
            activeTool = mode;
            const btnClick = document.getElementById('btnToolClick');
            const btnDraw = document.getElementById('btnToolDraw');

            if (mode === 'click') {
                btnClick.className = "py-2 px-3 rounded-lg border border-amber-400 bg-amber-700 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm";
                btnDraw.className = "py-2 px-3 rounded-lg border border-amber-400 bg-white text-gray-800 font-bold text-xs flex items-center justify-center gap-1.5 hover:bg-amber-50";
                canvas.style.pointerEvents = 'none';
            } else {
                btnDraw.className = "py-2 px-3 rounded-lg border border-amber-400 bg-amber-700 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm";
                btnClick.className = "py-2 px-3 rounded-lg border border-amber-400 bg-white text-gray-800 font-bold text-xs flex items-center justify-center gap-1.5 hover:bg-amber-50";
                canvas.style.pointerEvents = 'auto';
            }
        }

        function setColor(color, element) {
            brushColor = color;
            document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));
            element.classList.add('active');
        }

        function changeBrushSize(size) {
            brushLineWidth = size;
            document.getElementById('brushSizeVal').innerText = size + 'px';
        }

        function setupDrawingEvents() {
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseleave', stopDrawing);

            canvas.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                isDrawing = true;
                ctx.beginPath();
                ctx.moveTo(touch.clientX - rect.left, touch.clientY - rect.top);
            });
            canvas.addEventListener('touchmove', (e) => {
                if (!isDrawing) return;
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                ctx.strokeStyle = brushColor;
                ctx.lineWidth = brushLineWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineTo(touch.clientX - rect.left, touch.clientY - rect.top);
                ctx.stroke();
            });
            canvas.addEventListener('touchend', stopDrawing);
        }

        function startDrawing(e) {
            if (activeTool !== 'draw') return;
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        function draw(e) {
            if (!isDrawing || activeTool !== 'draw') return;
            const rect = canvas.getBoundingClientRect();
            ctx.strokeStyle = brushColor;
            ctx.lineWidth = brushLineWidth;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
        }

        function stopDrawing() { isDrawing = false; }
        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        // TÍNH NĂNG GÕ THÊM CHỮ CÓ THỂ CHỈNH CỠ CHỮ TO/NHỎ
        function addTextToSlide() {
            const text = prompt("Nhập lời ghi chú chú muốn gõ thêm lên slide:", "Ghi chú tử vi...");
            if (!text) return;

            const wrapper = document.createElement('div');
            wrapper.className = 'resizable-wrapper';
            wrapper.style.left = '80px';
            wrapper.style.top = '80px';

            wrapper.innerHTML = `
                <div class="delete-btn" onclick="this.parentElement.remove()">✕</div>
                <div class="flex items-center gap-1 mb-1 border-b border-amber-200 pb-0.5">
                    <span class="text-[10px] font-bold text-gray-600">Cỡ chữ:</span>
                    <button class="px-1 bg-amber-200 text-xs font-bold rounded" onclick="changeFontSize(this, -2)">-</button>
                    <button class="px-1 bg-amber-200 text-xs font-bold rounded" onclick="changeFontSize(this, 2)">+</button>
                </div>
                <div class="text-element text-red-950 font-black text-lg p-1">${text}</div>
            `;

            makeDraggable(wrapper);
            interactiveLayer.appendChild(wrapper);
        }

        function changeFontSize(btn, delta) {
            const textDiv = btn.parentElement.nextElementSibling;
            const currentSize = parseInt(window.getComputedStyle(textDiv).fontSize);
            textDiv.style.fontSize = (currentSize + delta) + 'px';
        }

        // TÍNH NĂNG CHÈN ẢNH CÓ THỂ KÉO TO THU NHỎ THOẢI MÁI
        function addImageToSlide(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const wrapper = document.createElement('div');
                wrapper.className = 'resizable-wrapper';
                wrapper.style.left = '120px';
                wrapper.style.top = '120px';

                wrapper.innerHTML = `
                    <div class="delete-btn" onclick="this.parentElement.remove()">✕</div>
                    <img src="${e.target.result}" style="width: 180px; height: auto; display: block; border-radius: 6px;">
                    <div class="resize-handle"></div>
                `;

                makeDraggable(wrapper);
                makeResizable(wrapper);
                interactiveLayer.appendChild(wrapper);
            };
            reader.readAsDataURL(file);
        }

        function makeDraggable(element) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            element.onmousedown = function(e) {
                if (e.target.classList.contains('resize-handle') || e.target.tagName === 'BUTTON' || e.target.classList.contains('delete-btn')) return;
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = function() {
                    document.onmouseup = null;
                    document.onmousemove = null;
                };
                document.onmousemove = function(e) {
                    e.preventDefault();
                    pos1 = pos3 - e.clientX;
                    pos2 = pos4 - e.clientY;
                    pos3 = e.clientX;
                    pos4 = e.clientY;
                    element.style.top = (element.offsetTop - pos2) + "px";
                    element.style.left = (element.offsetLeft - pos1) + "px";
                };
            };
        }

        function makeResizable(element) {
            const handle = element.querySelector('.resize-handle');
            const img = element.querySelector('img');

            handle.onmousedown = function(e) {
                e.preventDefault();
                e.stopPropagation();
                const startX = e.clientX;
                const startWidth = img.clientWidth;

                document.onmousemove = function(e) {
                    const newWidth = startWidth + (e.clientX - startX);
                    if (newWidth > 50) {
                        img.style.width = newWidth + 'px';
                    }
                };

                document.onmouseup = function() {
                    document.onmousemove = null;
                    document.onmouseup = null;
                };
            };
        }

        // TÍNH NĂNG IN / TẢI ẢNH SLIDE NÀY
        function exportSlideAsImage() {
            const slideArea = document.getElementById('slideCardContent');
            html2canvas(slideArea, {
                scale: 2,
                useCORS: true
            }).then(canvasImage => {
                const link = document.createElement('a');
                link.download = `Tu_Vi_Tuoi_Suu_Trang_${currentSlideIndex + 1}.png`;
                link.href = canvasImage.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
