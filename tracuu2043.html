<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Hạn Chuẩn Xác - Mật Mã Cuộc Đời</title>
    <style>
        body { 
            background-color: #f1f5f9; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; align-items: center; justify-content: center; 
            min-height: 100vh; padding: 12px; box-sizing: border-box; margin: 0; 
        }
        .main-card { 
            background: white; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.08); 
            border-top: 8px solid #b91c1c; width: 100%; max-w: 500px; 
            padding: 20px; box-sizing: border-box; margin: auto; 
        }
        .text-center { text-align: center; }
        .title-main { font-size: 24px; font-weight: 900; color: #991b1b; text-transform: uppercase; margin-bottom: 6px; letter-spacing: -0.5px; }
        .subtitle { font-size: 13px; color: #64748b; font-style: italic; font-weight: 600; margin-bottom: 20px; line-height: 1.4; }
        
        /* Cấu trúc co dãn thông minh: Mặc định trên iPhone xếp 1 cột dọc, lên máy tính tự chia 2 cột */
        .grid-layout { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
        @media (min-width: 480px) {
            .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
            .full-width { grid-column: span 2; }
        }
        
        .form-group { display: flex; flex-direction: column; }
        .form-label { font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 4px; text-align: left; }
        .form-input { 
            width: 100%; padding: 10px; border: 2px solid #cbd5e1; border-radius: 10px; 
            font-weight: bold; font-size: 16px; text-align: center; outline: none; box-sizing: border-box; background-color: #fff;
        }
        .form-input:focus { border-color: #b91c1c; }
        .btn-submit { 
            width: 100%; background-color: #b91c1c; color: white; border: none; padding: 14px; 
            border-radius: 10px; font-size: 16px; font-weight: 900; text-transform: uppercase; 
            cursor: pointer; margin-top: 4px; margin-bottom: 20px; transition: 0.2s; width: 100%; box-sizing: border-box;
        }
        .btn-submit:hover { background-color: #991b1b; }
        
        .han-box { 
            border-radius: 10px; padding: 12px; border: 1px solid #e2e8f0; background: #fff; 
            display: flex; flex-direction: column; justify-content: center; box-sizing: border-box; width: 100%;
        }
        .bg-blue { background-color: #f0fdf4; border-color: #bbf7d0; } /* Đã đổi màu nền nhẹ nhàng, thanh lịch hơn */
        .bg-orange { background-color: #fff7ed; border-color: #ffedd5; }
        .bad-news { color: #dc2626; font-weight: 800; }
        .good-news { color: #16a34a; font-weight: 800; }
        .label-title { font-size: 11px; font-weight: 800; text-transform: uppercase; color: #64748b; margin-bottom: 2px; text-align: left; display: block; }
        .box-value { font-size: 16px; font-weight: 900; text-align: left; margin: 0; line-height: 1.3; word-break: break-word; }
        .text-blue-dark { color: #14532d; }
        .text-orange-dark { color: #7c2d12; }
        
        .bottom-summary { background-color: #111827; padding: 14px; border-radius: 10px; margin-top: 12px; }
        .text-tuoi { font-size: 22px; font-weight: 900; color: #facc15; margin: 0; }
        .text-canchi { font-size: 12px; font-weight: 700; color: #9ca3af; text-transform: uppercase; margin-top: 2px; margin-bottom: 0; letter-spacing: 1px; }
        .hidden { display: none; }
        .space-y { display: flex; flex-direction: column; gap: 12px; }
    </style>
</head>
<body>
<div class="main-card">
    <h2 class="title-main text-center">Tra Cứu Sao Hạn Tự Động</h2>
    <p class="subtitle text-center">Dữ liệu gốc chính xác tuyệt đối - Hiển thị chuẩn hóa trên mọi thiết bị</p>
    
    <div class="grid-layout">
        <div class="form-group">
            <label class="form-label">Năm sinh (Dương lịch):</label>
            <input type="number" id="birthYear" value="1984" class="form-input">
        </div>
        <div class="form-group">
            <label class="form-label">Năm cần xem hạn:</label>
            <input type="number" id="currentYear" value="2027" class="form-input">
        </div>
        <div class="form-group full-width">
            <label class="form-label">Giới tính:</label>
            <select id="gender" class="form-input" style="text-align-last: center;">
                <option value="nam">Nam mạng</option>
                <option value="nu">Nữ mạng</option>
            </select>
        </div>
    </div>
    
    <button onclick="calculate()" class="btn-submit">Xem Kết Quả Chuẩn</button>
    
    <div id="resultArea" class="hidden space-y">
        <div class="grid-layout">
            <div class="han-box bg-blue">
                <span class="label-title">Sao Chiếu Mệnh</span>
                <p id="resSao" class="box-value text-blue-dark"></p>
            </div>
            <div class="han-box bg-orange">
                <span class="label-title">Hạn Niên</span>
                <p id="resHanNien" class="box-value text-orange-dark"></p>
            </div>
        </div>
        <div class="grid-layout">
            <div class="han-box">
                <span class="label-title">Tam Tai</span>
                <p id="resTamTai" class="box-value"></p>
            </div>
            <div class="han-box">
                <span class="label-title">Thái Tuế</span>
                <p id="resThaiTue" class="box-value"></p>
            </div>
        </div>
        <div class="grid-layout">
            <div class="han-box">
                <span class="label-title">Kim Lâu</span>
                <p id="resKimLau" class="box-value"></p>
            </div>
            <div class="han-box">
                <span class="label-title">Hoang Ốc</span>
                <p id="resHoangOc" class="box-value"></p>
            </div>
        </div>
        <div class="bottom-summary text-center">
            <p id="resTuoiMu" class="text-tuoi"></p>
            <p id="resCanChi" class="text-canchi"></p>
        </div>
    </div>
</div>

const chiNames = ["Tý", "Sửu", "Dần", "Mão", "Thìn", "Tỵ", "Ngọ", "Mùi", "Thân", "Dậu", "Tuất", "Hợi"];
const canNames = ["Canh", "Tân", "Nhâm", "Quý", "Giáp", "Ất", "Bính", "Đinh", "Mậu", "Kỷ"];

function calculate() {
    const birthYear = parseInt(document.getElementById('birthYear').value);
    const currentYear = parseInt(document.getElementById('currentYear').value);
    const gender = document.getElementById('gender').value;
    
    if (!birthYear || !currentYear || birthYear > currentYear) return;
    
    const tuoiMu = currentYear - birthYear + 1;
    document.getElementById('resTuoiMu').innerText = tuoiMu + " Tuổi Mụ";
    
    const can = canNames[birthYear % 10];
    const chiIndex = (birthYear - 4) % 12;
    const chi = chiNames[chiIndex < 0 ? chiIndex + 12 : chiIndex];
    document.getElementById('resCanChi').innerText = can + " " + chi + " (Xem hạn năm " + currentYear + ")";
    
    const record = SAO_HAN_DATA[tuoiMu];
    if (record) {
        document.getElementById('resSao').innerText = "S. " + (gender === 'nam' ? record.namSao : record.nuSao);
        document.getElementById('resHanNien').innerText = "H. " + (gender === 'nam' ? record.namHan : record.nuHan);
    } else {
        document.getElementById('resSao').innerText = "Ngoài phạm vi";
        document.getElementById('resHanNien').innerText = "Ngoài phạm vi";
    }
    
    const currentChiIdx = (currentYear - 4) % 12;
    const currentChi = chiNames[currentChiIdx < 0 ? currentChiIdx + 12 : currentChiIdx];
    
    // TAM TAI
    let ttText = "Không phạm";
    let ttClass = "good-news";
    const tamTaiMap = {
        "Thân": ["Dần", "Mão", "Thìn"], "Tý": ["Dần", "Mão", "Thìn"], "Thìn": ["Dần", "Mão", "Thìn"],
        "Dần": ["Thân", "Dậu", "Tuất"], "Ngọ": ["Thân", "Dậu", "Tuất"], "Tuất": ["Thân", "Dậu", "Tuất"],
        "Tỵ": ["Hợi", "Tý", "Sửu"], "Dậu": ["Hợi", "Tý", "Sửu"], "Sửu": ["Hợi", "Tý", "Sửu"],
        "Hợi": ["Tỵ", "Ngọ", "Mùi"], "Mão": ["Tỵ", "Ngọ", "Mùi"], "Mùi": ["Tỵ", "Ngọ", "Mùi"]
    };
    const hanTamTaiYears = tamTaiMap[chi];
    if (hanTamTaiYears && hanTamTaiYears.includes(currentChi)) {
        let namThu = hanTamTaiYears.indexOf(currentChi) + 1;
        ttText = "Phạm Tam Tai (Năm " + namThu + ")";
        ttClass = "bad-news";
    }
    document.getElementById('resTamTai').innerText = ttText;
    document.getElementById('resTamTai').className = "box-value " + ttClass;
    // THÁI TUẾ
    let thText = "Không phạm";
    let thClass = "good-news";
    if (chi === currentChi) { thText = "Trực Thái Tuế (Năm tuổi)"; thClass = "bad-news"; }
    else if (chiNames[(chiNames.indexOf(chi) + 6) % 12] === currentChi) { thText = "Xung Thái Tuế"; thClass = "bad-news"; }
    else if (chiNames[(chiNames.indexOf(chi) + 3) % 12] === currentChi || chiNames[(chiNames.indexOf(chi) + 9) % 12] === currentChi) { thText = "Hình Thái Tuế"; thClass = "bad-news"; }
    else if (chiNames[(chiNames.indexOf(chi) + 1) % 12] === currentChi || chiNames[(chiNames.indexOf(chi) + 11) % 12] === currentChi) { thText = "Hại Thái Tuế"; thClass = "bad-news"; }
    document.getElementById('resThaiTue').innerText = thText;
    document.getElementById('resThaiTue').className = "box-value " + thClass;

    // KIM LÂU
    const klDu = tuoiMu % 9;
    let klText = "Không phạm";
    let klClass = "good-news";
    if ([1, 3, 6, 8].includes(klDu) && tuoiMu > 10) {
        const types = {1:"Thân (Bản thân)", 3:"Thê (Vợ/Chồng)", 6:"Tử (Con cái)", 8:"Súc (Công việc)"};
        klText = "Phạm Kim Lâu " + types[klDu];
        klClass = "bad-news";
    }
    document.getElementById('resKimLau').innerText = klText;
    document.getElementById('resKimLau').className = "box-value " + klClass;

    // HOANG ỐC
    const hoLabels = ["1. Nhất Cát (Tốt)", "2. Nhì Nghi (Tốt)", "3. Tam Địa Sát (Xấu)", "4. Tứ Tấn Tài (Tốt)", "5. Ngũ Thọ Tử (Xấu)", "6. Lục Hoang Ốc (Xấu)"];
    let chuc = Math.floor(tuoiMu / 10);
    let donvi = tuoiMu % 10;
    let hoIdx = (chuc + donvi - 1) % 6;
    if (donvi === 0) hoIdx = (chuc - 1) % 6;
    if (tuoiMu < 10) hoIdx = (tuoiMu - 1) % 6;
    document.getElementById('resHoangOc').innerText = hoLabels[hoIdx];
    document.getElementById('resHoangOc').className = "box-value " + ([2, 4, 5].includes(hoIdx) ? "bad-news" : "good-news");

    document.getElementById('resultArea').classList.remove('hidden');
}
</script>
</body>
</html>
