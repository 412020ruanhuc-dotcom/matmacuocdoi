<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Hạn Chuẩn Xác - Kết Nối Cộng Đồng</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        body { background-color: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .main-card { background: white; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); border-top: 8px solid #b91c1c; }
        .han-box { border-radius: 12px; padding: 16px; border: 1px solid #e2e8f0; background: #fff; height: 100%; display: flex; flex-direction: column; justify-content: center; }
        .bad-news { color: #dc2626; font-weight: 800; }
        .good-news { color: #059669; font-weight: 800; }
        .label-title { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: #64748b; margin-bottom: 4px; display: block; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<div class="main-card w-full max-w-xl p-6 md:p-10">
    <h2 class="text-3xl font-black text-center text-red-800 mb-2 uppercase">Tra Cứu Sao Hạn Tự Động</h2>
    <p class="text-center text-gray-500 text-sm mb-6 font-semibold italic">Phần mềm tính toán tự động dựa trên thuật toán Tử Vi chuẩn xác</p>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Năm sinh (Dương lịch):</label>
            <input type="number" id="birthYear" value="1984" class="w-full px-4 py-3 border-2 rounded-xl focus:ring-2 focus:ring-red-500 outline-none text-center font-bold text-lg">
        </div>
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Năm cần xem hạn:</label>
            <input type="number" id="currentYear" value="2026" class="w-full px-4 py-3 border-2 rounded-xl text-center font-bold text-lg focus:ring-2 focus:ring-red-500 outline-none">
        </div>
        <div class="md:col-span-2">
            <label class="block text-sm font-bold text-gray-700 mb-1">Giới tính:</label>
            <select id="gender" class="w-full px-4 py-3 border-2 rounded-xl font-bold bg-white outline-none">
                <option value="nam">Nam mạng</option>
                <option value="nu">Nữ mạng</option>
            </select>
        </div>
    </div>
    
    <button onclick="calculate()" class="w-full bg-red-700 hover:bg-red-800 text-white font-black py-4 rounded-xl shadow-lg transition duration-300 uppercase text-lg mb-8">
        Xem Kết Quả Chuẩn
    </button>
    
    <div id="resultArea" class="hidden space-y-4">
        <div class="grid grid-cols-2 gap-4">
            <div class="han-box bg-blue-50">
                <span class="label-title">Sao Chiếu Mệnh</span>
                <p id="resSao" class="text-xl font-black text-blue-900"></p>
            </div>
            <div class="han-box bg-orange-50">
                <span class="label-title">Hạn Niên</span>
                <p id="resHanNien" class="text-xl font-black text-orange-900"></p>
            </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div class="han-box">
                <span class="label-title">Tam Tai</span>
                <p id="resTamTai" class="text-lg"></p>
            </div>
            <div class="han-box">
                <span class="label-title">Thái Tuế</span>
                <p id="resThaiTue" class="text-lg"></p>
            </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div class="han-box">
                <span class="label-title">Kim Lâu</span>
                <p id="resKimLau" class="text-lg"></p>
            </div>
            <div class="han-box">
                <span class="label-title">Hoang Ốc</span>
                <p id="resHoangOc" class="text-lg"></p>
            </div>
        </div>
        <div class="p-4 bg-gray-900 text-white rounded-xl text-center">
            <p id="resTuoiMu" class="text-2xl font-black text-yellow-400"></p>
            <p id="resCanChi" class="text-sm font-bold text-gray-400 uppercase tracking-widest mt-1"></p>
        </div>
    </div>
</div>
<script>
const chiNames = ["Tý", "Sửu", "Dần", "Mão", "Thìn", "Tỵ", "Ngọ", "Mùi", "Thân", "Dậu", "Tuất", "Hợi"];
const canNames = ["Canh", "Tân", "Nhâm", "Quý", "Giáp", "Ất", "Bính", "Đinh", "Mậu", "Kỷ"];

// 1. Thuật toán tính Sao Chiếu Mệnh chuẩn xác theo Cửu Diệu
function getSao(tuoiMu, gender) {
    const namSao = ["La Hầu", "Thổ Tú", "Thủy Diệu", "Thái Bạch", "Thái Dương", "Vân Hớn", "Kế Đô", "Thái Âm", "Mộc Đức"];
    const nuSao  = ["Kế Đô", "Vân Hớn", "Mộc Đức", "Thái Âm", "Thổ Tú", "La Hầu", "Thái Dương", "Thủy Diệu", "Thái Bạch"];
    
    let du = tuoiMu % 9;
    let idx = du === 0 ? 8 : du - 1;
    return gender === 'nam' ? namSao[idx] : nuSao[idx];
}

// 2. Thuật toán tính Bát Hạn Niên chuẩn xác
function getHanNien(tuoiMu, gender) {
    const namHan = ["Huỳnh Tuyền", "Tam Kheo", "Ngũ Mộ", "Thiên Tinh", "Toán Tận", "Thiên La", "Địa Võng", "Diêm Vương"];
    const nuHan  = ["Huỳnh Tuyền", "Thiên Tinh", "Ngũ Mộ", "Tam Kheo", "Toán Tận", "Diêm Vương", "Địa Võng", "Thiên La"];
    
    let du = tuoiMu % 8;
    let idx = du === 0 ? 7 : du - 1;
    return gender === 'nam' ? namHan[idx] : nuHan[idx];
}

function calculate() {
    const birthYear = parseInt(document.getElementById('birthYear').value);
    const currentYear = parseInt(document.getElementById('currentYear').value);
    const gender = document.getElementById('gender').value;
    
    if (!birthYear || !currentYear || birthYear > currentYear) return;
    
    const tuoiMu = currentYear - birthYear + 1;
    
    // HIỂN THỊ TUỔI MỤ
    document.getElementById('resTuoiMu').innerText = tuoiMu + " Tuổi Mụ";
    
    // XÁC ĐỊNH CAN CHI TUỔI SINH
    const can = canNames[birthYear % 10];
    const chiIndex = (birthYear - 4) % 12;
    const chi = chiNames[chiIndex < 0 ? chiIndex + 12 : chiIndex];
    document.getElementById('resCanChi').innerText = can + " " + chi + " (Xem hạn năm " + currentYear + ")";
    
    // GẮN KẾT QUẢ SAO VÀ HẠN
    document.getElementById('resSao').innerText = "S. " + getSao(tuoiMu, gender);
    document.getElementById('resHanNien').innerText = "H. " + getHanNien(tuoiMu, gender);
    
    // XÁC ĐỊNH CHI CỦA NĂM XEM HẠN ĐỂ TÍNH HẠN ĐỘNG
    const currentChiIdx = (currentYear - 4) % 12;
    const currentChi = chiNames[currentChiIdx < 0 ? currentChiIdx + 12 : currentChiIdx];
    
    // 3. THUẬT TOÁN TAM TAI ĐỘNG TỰ ĐỘNG XOAY THEO NĂM XEM
    let ttText = "Không phạm";
    let ttClass = "good-news";
    
    const tamTaiMap = {
        "Thân": ["Dần", "Mão", "Thìn"], "Tý": ["Dần", "Mão", "Thìn"], "Thìn": ["Dần", "Mão", "Thìn"],
        "Dần": ["Thân", "Dậu", "Tuất"], "Ngọ": ["Thân", "Dậu", "Tuất"], "Tuất": ["Thân", "Dậu", "Tuất"],
        "Tỵ": ["Hợi", "Tý", "Sửu"], "Dậu": ["Hợi", "Tý", "Sửu"], "Sửu": ["Hợi", "Tý", "Sửu"],
        "Hợi": ["Tỵ", "Ngọ", "Mùi"], "Mão": ["Tỵ", "Ngọ", "Mùi"], "Mùi": ["Tỵ", "Ngọ", "Mùi"]
    };
    
    const hanTamTaiYears = tamTaiMap[chi];
    if (hanTamTaiYears && hanTamTaiYears.includes(currentChi)) {
        let namThu = hanTamTaiYears.indexOf(currentChi) + 1;
        ttText = "Phạm Tam Tai (Năm thứ " + namThu + ")";
        ttClass = "bad-news";
    }
    document.getElementById('resTamTai').innerText = ttText;
    document.getElementById('resTamTai').className = "text-lg " + ttClass;
    
    // 4. THUẬT TOÁN THÁI TUẾ ĐỘNG TỰ ĐỘNG THEO NĂM XEM
    let thText = "Không phạm";
    if (chi === currentChi) thText = "Trực Thái Tuế (Năm tuổi)";
    else if (chiNames[(chiNames.indexOf(chi) + 6) % 12] === currentChi) thText = "Xung Thái Tuế (Xấu)";
    else if (chiNames[(chiNames.indexOf(chi) + 3) % 12] === currentChi || chiNames[(chiNames.indexOf(chi) + 9) % 12] === currentChi) thText = "Hình Thái Tuế (Xấu)";
    else if (chiNames[(chiNames.indexOf(chi) + 1) % 12] === currentChi || chiNames[(chiNames.indexOf(chi) + 11) % 12] === currentChi) thText = "Hại Thái Tuế (Xấu)";
    
    document.getElementById('resThaiTue').innerText = thText;
    document.getElementById('resThaiTue').className = "text-lg " + (thText === "Không phạm" ? "good-news" : "bad-news");
    
    // 5. THUẬT TOÁN KIM LÂU CHUẨN XÁC
    const klDu = tuoiMu % 9;
    let klText = "Không phạm";
    if ([1, 3, 6, 8].includes(klDu) && tuoiMu > 10) {
        const types = {1:"Thân (Hại bản thân)", 3:"Thê (Hại gia đình)", 6:"Tử (Hại con cái)", 8:"Súc (Hại công việc)"};
        klText = "Phạm Kim Lâu " + types[klDu];
        document.getElementById('resKimLau').className = "text-lg bad-news";
    } else {
        document.getElementById('resKimLau').className = "text-lg good-news";
    }
    document.getElementById('resKimLau').innerText = klText;
    
    // 6. THUẬT TOÁN HOANG ỐC CHUẨN XÁC
    const hoLabels = ["1. Nhất Cát (Tốt - Nên làm nhà)", "2. Nhì Nghi (Tốt - Nhà cửa hưng vượng)", "3. Tam Địa Sát (Xấu - Phạm bệnh tật)", "4. Tứ Tấn Tài (Tốt - Phúc lộc gõ cửa)", "5. Ngũ Thọ Tử (Xấu - Gia đình ly tán)", "6. Lục Hoang Ốc (Xấu - Sự nghiệp sa sút)"];
    let chuc = Math.floor(tuoiMu / 10);
    let donvi = tuoiMu % 10;
    let hoIdx = (chuc + donvi - 1) % 6;
    if (donvi === 0) hoIdx = (chuc - 1) % 6;
    if (tuoiMu < 10) hoIdx = (tuoiMu - 1) % 6;
    
    document.getElementById('resHoangOc').innerText = hoLabels[hoIdx];
    document.getElementById('resHoangOc').className = "text-lg " + ([2, 4, 5].includes(hoIdx) ? "bad-news" : "good-news");
    
    document.getElementById('resultArea').classList.remove('hidden');
}
</script>
</body>
</html>
