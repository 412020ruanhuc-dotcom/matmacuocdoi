<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần Mềm Bát Cực Linh Số</title>
    <style>
        body {
            background-color: #20373b;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 30px auto;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid #d4af37;
        }
        h1 {
            color: #d4af37;
            font-size: 26px;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px #000;
        }
        input[type="text"] {
            width: 80%;
            padding: 12px;
            font-size: 18px;
            border-radius: 5px;
            border: 1px solid #d4af37;
            margin-bottom: 15px;
            text-align: center;
        }
        button {
            background-color: #d4af37;
            color: #20373b;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #fff;
        }
        .result {
            margin-top: 25px;
            text-align: left;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .pair-item {
            margin-bottom: 10px;
            padding: 8px;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            font-size: 16px;
        }
        .cat { color: #4caf50; font-weight: bold; }
        .hung { color: #f44336; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>BÁT CỰC LINH SỐ</h1>
        <p>Tự học hỏi - Tự nghiệm lý số điện thoại</p>
        
        <input type="text" id="phoneInput" placeholder="Nhập số điện thoại cần tra..." maxlength="11">
        <br>
        <button onclick="tinhBatCuc()">Tra Cứu Khử Hung</button>

        <div class="result" id="resultBox">
            <h3 style="color: #d4af37; text-align: center; margin-top: 0;">Kết Quả Phân Tích Bát Tinh:</h3>
            <div id="resultContent"></div>
        </div>
    </div>

    <script>
        // Định nghĩa 64 cặp số tương ứng với Bát Tinh theo trường phái Bát Cực Linh Số
        const batTinhData = {
            // 4 Sao Cát (Tốt)
            "Sinh Khí": { pairs: ["14", "41", "67", "76", "39", "93", "28", "82"], type: "cat", desc: "Tốt cho tài lộc, danh tiếng, quý nhân phù trợ." },
            "Thiên Y": { pairs: ["13", "31", "68", "86", "49", "94", "27", "72"], type: "cat", desc: "Tốt cho sức khỏe, tiền tài, tích lũy tài sản." },
            "Diên Niên": { pairs: ["19", "91", "78", "87", "34", "43", "26", "62"], type: "cat", desc: "Tốt cho sự nghiệp vững vàng, gia đạo êm ấm, thọ mệnh." },
            "Phục Vị": { pairs: ["11", "22", "33", "44", "66", "77", "88", "99", "00", "55"], type: "cat", desc: "Bình hòa, mang tính chất kế thừa, ổn định, kiên trì." },
            
            // 4 Sao Hung (Xấu)
            "Tuyệt Mệnh": { pairs: ["12", "21", "69", "96", "48", "84", "37", "73"], type: "hung", desc: "Xấu. Dễ hao tài, tranh chấp, ảnh hưởng tinh thần." },
            "Ngũ Quỷ": { pairs: ["18", "81", "79", "97", "36", "63", "24", "42"], type: "hung", desc: "Xấu. Tai bay vạ gió, trắc trở, tâm tư bất an." },
            "Lục Sát": { pairs: ["16", "61", "47", "74", "38", "83", "29", "92"], type: "hung", desc: "Xấu. Thị phi tai tiếng, tình duyên trắc trở." },
            "Họa Hại": { pairs: ["17", "71", "89", "98", "46", "64", "23", "32"], type: "hung", desc: "Xấu. Bị gièm pha, khó thành việc lớn, dễ mất mát nhỏ." }
        };

        function timSao(caiCap) {
            for (let sao in batTinhData) {
                if (batTinhData[sao].pairs.includes(caiCap)) {
                    return { tenSao: sao, loai: batTinhData[sao].type, yNghia: batTinhData[sao].desc };
                }
            }
            return { tenSao: "Chưa định nghĩa", loai: "binh", yNghia: "Cặp số phụ hoặc chứa số đặc biệt." };
        }

        function tinhBatCuc() {
            let phone = document.getElementById("phoneInput").value.trim();
            // Lọc chỉ lấy các chữ số
            phone = phone.replace(/[^0-9]/g, '');
            
            if (phone.length < 4) {
                alert("Chú vui lòng nhập số điện thoại đầy đủ hơn để phân tích nhé!");
                return;
            }

            let htmlContent = "";
            
            // Duyệt từng cặp số liên tiếp từ trái qua phải
            for (let i = 0; i < phone.length - 1; i++) {
                let capSo = phone.substr(i, 2);
                let ketQuaSao = timSao(capSo);
                let mauSacClass = ketQuaSao.loai === "cat" ? "cat" : (ketQuaSao.loai === "hung" ? "hung" : "");
                let nhãnLoai = ketQuaSao.loai === "cat" ? "[CÁT]" : (ketQuaSao.loai === "hung" ? "[HUNG]" : "[BÌNH]");

                htmlContent += `<div class="pair-item"> Cặp số <strong>${capSo}</strong>: Thuộc sao <span class="${mauSacClass}">${ketQuaSao.tenSao} ${nhãnLoai}</span> <br> <small style="color: #bbb;">➔ ${ketQuaSao.yNghia}</small></div>`;
            }

            document.getElementById("resultContent").innerHTML = htmlContent;
            document.getElementById("resultBox").style.display = "block";
        }
    </script>
</body>
</html>
