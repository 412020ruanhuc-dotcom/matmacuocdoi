<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Hạn Chuẩn Xác - Mật Mã Cuộc Đời</title>
    <style>
        body { background-color: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; box-sizing: border-box; margin: 0; }
        .main-card { background: white; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); border-top: 8px solid #b91c1c; width: 100%; max-w: 550px; padding: 30px; box-sizing: border-box; margin: auto; }
        .text-center { text-align: center; }
        .title-main { font-size: 28px; font-weight: 900; color: #991b1b; text-transform: uppercase; margin-bottom: 8px; }
        .subtitle { font-size: 14px; color: #64748b; font-style: italic; font-weight: 600; margin-bottom: 24px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        @media (max-width: 500px) { .grid-2 { grid-template-columns: 1fr; } }
        .full-width { grid-column: span 2; }
        @media (max-width: 500px) { .full-width { grid-column: span 1; } }
        .form-group { display: flex; flex-direction: column; }
        .form-label { font-size: 14px; font-weight: 700; color: #334155; margin-bottom: 6px; text-align: left; }
        .form-input { width: 100%; padding: 12px; border: 2px solid #cbd5e1; border-radius: 12px; font-weight: bold; font-size: 18px; text-align: center; outline: none; box-sizing: border-box; }
        .form-input:focus { border-color: #ef4444; }
        .btn-submit { width: 100%; background-color: #b91c1c; color: white; border: none; padding: 16px; border-radius: 12px; font-size: 18px; font-weight: 900; text-transform: uppercase; cursor: pointer; margin-bottom: 24px; transition: 0.2s; }
        .btn-submit:hover { background-color: #991b1b; }
        .han-box { border-radius: 12px; padding: 16px; border: 1px solid #e2e8f0; background: #fff; display: flex; flex-direction: column; justify-content: center; box-sizing: border-box; }
        .bg-blue { background-color: #eff6ff; border-color: #bfdbfe; }
        .bg-orange { background-color: #fff7ed; border-color: #ffedd5; }
        .bad-news { color: #dc2626; font-weight: 800; }
        .good-news { color: #059669; font-weight: 800; }
        .label-title { font-size: 12px; font-weight: 800; text-transform: uppercase; color: #64748b; margin-bottom: 6px; text-align: left; display: block; }
        .box-value { font-size: 18px; font-weight: 900; text-align: left; margin: 0; }
        .text-blue-dark { color: #1e3a8a; }
        .text-orange-dark { color: #7c2d12; }
        .bottom-summary { background-color: #111827; padding: 16px; border-radius: 12px; margin-top: 16px; }
        .text-tuoi { font-size: 24px; font-weight: 900; color: #facc15; margin: 0; }
        .text-canchi { font-size: 13px; font-weight: 700; color: #9ca3af; text-transform: uppercase; margin-top: 4px; margin-bottom: 0; }
        .hidden { display: none; }
        .space-y { display: flex; flex-direction: column; gap: 16px; }
    </style>
</head>
<body>
<div class="main-card">

    <p class="subtitle text-center">Hệ thống tra cứu dữ liệu gốc chính xác 100% không dùng công thức tính mò</p>
    <div class="grid-2">
        <div class="form-group">
            <label class="form-label">Năm sinh (Dương lịch):</label>
            <input type="number" id="birthYear" value="1984" class="form-input">
        </div>
        <div class="form-group">
            <label class="form-label">Năm cần xem hạn:</label>

        </div>
        <div class="form-group full-width">
            <label class="form-label">Giới tính:</label>
            <select id="gender" class="form-input" style="text-align-last: center;">

                <option value="nu">Nữ mạng</option>
            </select>
        </div>
    </div>
    <button onclick="calculate()" class="btn-submit">Xem Kết Quả Chuẩn</button>
    <div id="resultArea" class="hidden space-y">
        <div class="grid-2">
            <div class="han-box bg-blue">
                <span class="label-title">Sao Chiếu Mệnh</span>
                <p id="resSao" class="box-value text-blue-dark"></p>
            </div>
            <div class="han-box bg-orange">
                <span class="label-title">Hạn Niên</span>
                <p id="resHanNien" class="box-value text-orange-dark"></p>
            </div>
        </div>
        <div class="grid-2">
            <div class="han-box">

            </div>
            <div class="han-box">

        </div>
        <div class="grid-2">

            </div>
            <div class="han-box">

        </div>
        <div class="bottom-summary text-center">

    </div>

            const birthYear = parseInt(document.getElementById('birthYear').value);
