        body {
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            background-color: #0b0f19;
            color: #f3f4f6;
        }

        /* Perspective for 3D flip effect */
        .slide-stage {
            perspective: 1500px;
        }

        .slide-card {
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease;
            transform-style: preserve-3d;
            backface-visibility: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        /* Flip animation classes */
        .slide-card.flip-next-out {
            transform: rotateY(-90deg) scale(0.95);
            opacity: 0;
        }

        .slide-card.flip-next-in {
            animation: flipNextIn 0.6s ease forwards;
        }

        .slide-card.flip-prev-out {
            transform: rotateY(90deg) scale(0.95);
            opacity: 0;
        }

        .slide-card.flip-prev-in {
            animation: flipPrevIn 0.6s ease forwards;
        }

        @keyframes flipNextIn {
            from { transform: rotateY(90deg) scale(0.95); opacity: 0; }
            to { transform: rotateY(0deg) scale(1); opacity: 1; }
        }

        @keyframes flipPrevIn {
            from { transform: rotateY(-90deg) scale(0.95); opacity: 0; }
            to { transform: rotateY(0deg) scale(1); opacity: 1; }
        }

        /* Canvas overlay layer */
        #annotation-canvas {
            touch-action: none;
        }

        /* Custom Scrollbar for slide overflow content */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;

            border-image: linear-gradient(to right, #D4AF37, #8B5CF6) 1;

    </style>

                bgClass: "from-slate-950 via-slate-900 to-amber-950/40",
                content: `

        // STATE MANAGEMENT
        let currentSlide = 0;
        let zoomScale = 1;
        let activeTool = 'pointer'; // 'pointer', 'pen', 'highlighter', 'eraser'
        let currentColor = '#EF4444';
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        // Stores drawing data per slide: { slideIndex: [ strokeObjects ] }
        const slideDrawings = {};

        // DOM ELEMENTS
        const slidesViewport = document.getElementById('slides-viewport');
        const slideIndicator = document.getElementById('slide-indicator');
        const zoomWrapper = document.getElementById('zoom-wrapper');
        const zoomLevelText = document.getElementById('zoom-level');
        const canvas = document.getElementById('annotation-canvas');
        const ctx = canvas.getContext('2d');
        const thumbnailNav = document.getElementById('thumbnail-nav');
        const panHint = document.getElementById('pan-hint');

        // INITIALIZATION
        window.addEventListener('DOMContentLoaded', () => {
            renderSlide(currentSlide);
            renderThumbnails();
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            setupCanvasEvents();
        });

        // RENDER SLIDE CONTENT
        function renderSlide(index, direction = 'none') {
            const slide = slidesData[index];
            
            // Build slide HTML
            const slideHtml = `
                <div class="slide-card absolute inset-0 w-full h-full bg-gradient-to-br ${slide.bgClass} flex flex-col overflow-y-auto custom-scrollbar">
                    ${slide.content}
                </div>
            `;

            slidesViewport.innerHTML = slideHtml;
            slideIndicator.textContent = `${index + 1} / ${slidesData.length}`;

            // Update Thumbnail active states
            const thumbs = thumbnailNav.querySelectorAll('button');
            thumbs.forEach((t, idx) => {
                if (idx === index) {
                    t.className = "px-2.5 py-1 rounded bg-amber-500/30 text-amber-300 font-bold border border-amber-500/50 text-xs";
                } else {
                    t.className = "px-2.5 py-1 rounded bg-slate-800/80 hover:bg-slate-700 text-slate-400 text-xs transition";
                }
            });

            // Redraw annotations for this slide
            redrawCanvas();
        }

        // RENDER THUMBNAIL NAVIGATION IN FOOTER
        function renderThumbnails() {
            thumbnailNav.innerHTML = '';
            slidesData.forEach((_, idx) => {
                const btn = document.createElement('button');
                btn.textContent = `Slide ${idx + 1}`;
                btn.onclick = () => goToSlide(idx);
                thumbnailNav.appendChild(btn);
            });
        }

        // SLIDE NAVIGATION LOGIC
        function nextSlide() {
            if (currentSlide < slidesData.length - 1) {
                currentSlide++;
                renderSlide(currentSlide, 'next');
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                renderSlide(currentSlide, 'prev');
            }
        }

        function goToSlide(index) {
            if (index >= 0 && index < slidesData.length && index !== currentSlide) {
                currentSlide = index;
                renderSlide(currentSlide);
            }
        }

        // KEYBOARD NAVIGATION
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space') {
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                prevSlide();
            }
        });

        // ZOOM CONTROLS
        function zoomIn() {
            if (zoomScale < 2.5) {
                zoomScale += 0.25;
                applyZoom();
            }
        }

        function zoomOut() {
            if (zoomScale > 0.75) {
                zoomScale -= 0.25;
                applyZoom();
            }
        }

        function resetZoom() {
            zoomScale = 1;
            applyZoom();
        }

        function applyZoom() {
            zoomWrapper.style.transform = `scale(${zoomScale})`;
            zoomLevelText.textContent = `${Math.round(zoomScale * 100)}%`;
            
            if (zoomScale > 1) {
                panHint.style.opacity = '1';
            } else {
                panHint.style.opacity = '0';
            }
        }

        // CANVAS ANNOTATION LOGIC
        function resizeCanvas() {
            const rect = slidesViewport.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            redrawCanvas();
        }

        function setTool(tool) {
            activeTool = tool;
            
            // Update UI Active State
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`tool-${tool}`);
            if (activeBtn) activeBtn.classList.add('active');

            if (tool === 'pointer') {
                canvas.style.pointerEvents = 'none';
            } else {
                canvas.style.pointerEvents = 'auto';
            }
        }

        function setColor(color) {
            currentColor = color;
            if (activeTool === 'pointer' || activeTool === 'eraser') {
                setTool('pen');
            }
        }

        function setupCanvasEvents() {
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseleave', stopDrawing);

            // Touch events for mobile/tablet
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                startDrawing(touch);
            });
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                draw(touch);
            });
            canvas.addEventListener('touchend', stopDrawing);
        }

        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * (canvas.width / rect.width),
                y: (e.clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function startDrawing(e) {
            if (activeTool === 'pointer') return;
            isDrawing = true;
            const coords = getCanvasCoords(e);
            lastX = coords.x;
            lastY = coords.y;

            if (!slideDrawings[currentSlide]) {
                slideDrawings[currentSlide] = [];
            }
        }

        function draw(e) {
            if (!isDrawing || activeTool === 'pointer') return;

            const coords = getCanvasCoords(e);
            
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(coords.x, coords.y);

            if (activeTool === 'pen') {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = currentColor;
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.globalAlpha = 1.0;
            } else if (activeTool === 'highlighter') {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = currentColor;
                ctx.lineWidth = 18;
                ctx.lineCap = 'square';
                ctx.lineJoin = 'miter';
                ctx.globalAlpha = 0.35; // Translucent
            } else if (activeTool === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.lineWidth = 24;
                ctx.lineCap = 'round';
                ctx.globalAlpha = 1.0;
            }

            ctx.stroke();

            // Store stroke point data
            slideDrawings[currentSlide].push({
                x1: lastX,
                y1: lastY,
                x2: coords.x,
                y2: coords.y,
                tool: activeTool,
                color: currentColor,
                alpha: ctx.globalAlpha,
                width: ctx.lineWidth
            });

            lastX = coords.x;
            lastY = coords.y;
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function redrawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const strokes = slideDrawings[currentSlide];
            if (!strokes || strokes.length === 0) return;

            strokes.forEach(s => {
                ctx.beginPath();
                ctx.moveTo(s.x1, s.y1);
                ctx.lineTo(s.x2, s.y2);

                if (s.tool === 'eraser') {
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.lineWidth = s.width;
                } else {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = s.color;
                    ctx.lineWidth = s.width;
                    ctx.globalAlpha = s.alpha || 1.0;
                    ctx.lineCap = s.tool === 'highlighter' ? 'square' : 'round';
                }

                ctx.stroke();
            });
        }

        function clearCurrentCanvas() {
            slideDrawings[currentSlide] = [];
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // FULLSCREEN TOGGLE
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
                document.getElementById('fullscreen-icon').className = "fa-solid fa-compress";
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    document.getElementById('fullscreen-icon').className = "fa-solid fa-expand";
                }
            }
        }
    </script>
