<!DOCTYPE html>
<html lang="vi-VN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Năng Lượng Sim Theo Bát Cực Linh Số</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; color: #333; line-height: 1.6; padding: 20px; }
        .container { max-width: 650px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #b30000; font-size: 24px; margin-bottom: 5px; }
        p.subtitle { text-align: center; font-style: italic; color: #666; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #444; }
        input[type="text"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .radio-group { display: flex; gap: 20px; padding: 5px 0; }
        .radio-group label { font-weight: normal; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        button { width: 100%; background-color: #b30000; color: white; padding: 12px; border: none; border-radius: 4px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #8a0000; }
    </style>
</head>
<body>
<div class="container">
    <h1>BÁT CỰC LINH SỐ</h1>
    <p class="subtitle">Công cụ tra cứu năng lượng số điện thoại miễn phí cho cộng đồng</p>
    <form id="formTraCuu">
        <div class="form-group"><label>Số sim cần xem *</label><input type="text" id="sosim" placeholder="Ví dụ: 0912345678" required></div>
        <div class="form-group"><label>Số CCCD *</label><input type="text" id="cccd" placeholder="Nhập số căn cước công dân" required></div>
        <div class="form-group"><label>Giới tính *</label>
            <div class="radio-group"><label><input type="radio" name="gioitinh" value="nam" checked> Nam</label><label><input type="radio" name="gioitinh" value="nu"> Nữ</label></div>
        </div>
        <div class="form-group"><label>Loại lịch sinh</label>
            <div class="radio-group"><label><input type="radio" name="loailich" value="dl" checked> Dương lịch</label><label><input type="radio" name="loailich" value="al"> Âm lịch</label></div>
        </div>
        <div class="form-group"><label>Ngày tháng năm sinh</label>
            <div style="display: flex; gap: 10px;">
                <select id="ngay生"><option value="">Ngày</option><script>for(let i=1;i<=31;i++) document.write(`<option value="${i}">${i}</option>`);</script></select>
                <select id="thang生"><option value="">Tháng</option><script>for(let i=1;i<=12;i++) document.write(`<option value="${i}">${i}</option>`);</script></select>
                <select id="nam生"><option value="">Năm</option><script>let n=new Date().getFullYear();for(let i=n;i>=1940;i--) document.write(`<option value="${i}">${i}</option>`);</script></select>
            </div>
        </div>
        <div class="form-group"><label>Giờ phút sinh (Nếu nhớ)</label>
            <div style="display: flex; gap: 10px;">
                <select id="gio生"><option value="">Giờ</option><script>for(let i=0;i<=23;i++) document.write(`<option value="${i}">${i} Giờ</option>`);</script></select>
                <select id="phut生"><option value="">Phút</option><script>for(let i=0;i<=59;i++) document.write(`<option value="${i}">${i} Phút</option>`);</script></select>
            </div>
        </div>
        <div class="form-group"><label>Mục đích sử dụng sim (Tùy chọn)</label>
            <select id="mucdich"><option value="">-- Chọn mục đích --</option><option value="ca-nhan">Phát Triển Cá Nhân</option><option value="tai-loc">Tài Lộc – Giữ Tiền</option><option value="quy-nhan">Quý Nhân Khai Lộc</option><option value="gia-dao">Gia Đạo – Hôn Nhân</option><option value="suc-khoe">Sức Khỏe – An Yên</option></select>
        </div>
        <div class="form-group"><label>Tình trạng hôn nhân (Tùy chọn)</label>
            <select id="honnhan"><option value="">-- Chọn tình trạng --</option><option value="doc-than">Độc thân</option><option value="ket-hon">Đã kết hôn</option></select>
        </div>
        <button type="button" onclick="chayLuanGiai()">✦ XEM NĂNG LƯỢNG SỐ →</button>
    </form>
    <div id="vungKetQua" style="display: none; margin-top: 30px; padding: 20px; border: 2px dashed #b30000; background: #fffbfb; border-radius: 6px;">
        <div style="color: #b30000; font-size: 20px; font-weight: bold; text-align: center; margin-bottom: 15px; border-bottom: 1px solid #ecc; padding-bottom: 10px;">KẾT QUẢ LUẬN GIẢI NĂNG LƯỢNG</div>
        <div id="kqSim" style="margin-bottom: 12px; font-size: 16px;"></div>
        <div id="kqChiTiet" style="margin-bottom: 12px; font-size: 16px; line-height: 1.8;"></div>
    </div>
    <div class="footer-text">Website chia sẻ kiến thức Tử Vi & Năng Lượng Số phi lợi nhuận vì cộng đồng.</div>
</div>
<script>
    const bangCatTinh = {
        '11':'Phục Vị','22':'Phục Vị','33':'Phục Vị','44':'Phục Vị','66':'Phục Vị','77':'Phục Vị','88':'Phục Vị','99':'Phục Vị',
        '13':'Thiên Y','31':'Thiên Y','68':'Thiên Y','86':'Thiên Y','49':'Thiên Y','94':'Thiên Y','27':'Thiên Y','72':'Thiên Y',
        '14':'Sinh Khí','41':'Sinh Khí','67':'Sinh Khí','76':'Sinh Khí','39':'Sinh Khí','93':'Sinh Khí','28':'Sinh Khí','82':'Sinh Khí'
    };
    const bangHungTinh = {
        '19':'Diên Niên','91':'Diên Niên','78':'Diên Niên','87':'Diên Niên',
        '17':'Họa Hại','71':'Họa Hại','89':'Họa Hại','98':'Họa Hại',
        '12':'Tuyệt Mệnh','21':'Tuyệt Mệnh','69':'Tuyệt Mệnh','96':'Tuyệt Mệnh',
        '18':'Ngũ Quỷ','81':'Ngũ Quỷ','79':'Ngũ Quỷ','97':'Ngũ Quỷ',
        '16':'Lục Sát','61':'Lục Sát','47':'Lục Sát','74':'Lục Sát'
    };
    function chayLuanGiai() {
        let soSim = document.getElementById('sosim').value.trim();
        let chuoiSo = soSim.replace(/[^0-9]/g, '');
        if(chuoiSo.length < 4) { alert("Số sim quá ngắn!"); return; }
        let htmlKetQua = "";
        for(let i = 0; i < chuoiSo.length - 1; i++) {
            let capSo = chuoiSo.substring(i, i + 2);
            if(capSo.includes('0') || capSo.includes('5')) continue; 
            let tenTinh = bangCatTinh[capSo] || bangHungTinh[capSo];
            if(tenTinh) {
                let mau = bangCatTinh[capSo] ? '#2ed573' : '#ff4757';
                htmlKetQua += `• Cặp số <b>${capSo}</b>: <span style="background:${mau};color:white;padding:2px 6px;border-radius:4px;font-weight:bold;">${tenTinh}</span><br>`;
            }
        }
        document.getElementById('kqSim').innerHTML = `Số kiểm tra: <b>${soSim}</b>`;
        document.getElementById('kqChiTiet').innerHTML = htmlKetQua;
        document.getElementById('vungKetQua').style.display = "block";
    }
</script>
</body>
</html>
