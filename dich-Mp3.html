<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>CÔNG CỤ BÓC CHỮ MP3 MIỄN PHÍ</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #1e1e1e; color: white; text-align: center; }
        .box { max-width: 600px; margin: auto; background: #2d2d2d; padding: 30px; border-radius: 10px; border: 1px solid #444; }
        input, button { margin-top: 15px; padding: 12px; font-size: 16px; border-radius: 5px; border: none; }
        button { background: #ff9800; color: black; font-weight: bold; cursor: pointer; width: 100%; }
        textarea { width: 100%; height: 250px; margin-top: 20px; padding: 10px; background: #111; color: #00ff00; border: 1px solid #555; font-size: 15px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="box">
    <h2>CÔNG CỤ CHUYỂN MP3 THÀNH CHỮ (LÀM KỊCH BẢN)</h2>
    <p>Chú chọn file MP3 từ máy tính rồi bấm nút để lấy chữ sang Canva nhé chú.</p>
    
    <input type="file" id="audioFileInput" accept="audio/mp3"><br>
    <button onclick="processAudioToText()">BẮM VÀO ĐÂY ĐỂ AI XUẤT RA CHỮ</button>
    <textarea id="txtResult" placeholder="Chữ kịch bản sẽ hiện ở đây... Chú chỉ cần quét chuột Copy mang sang Canva thôi ạ."></textarea>
</div>

<script>
async function processAudioToText() {
    const fileSelector = document.getElementById('audioFileInput');
    const outputArea = document.getElementById('txtResult');
    if (fileSelector.files.length === 0) { alert("Chú ơi, chú chưa chọn file MP3 nào kìa!"); return; }
    
    outputArea.value = "Hệ thống đang xử lý... AI đang bóc chữ tiếng Việt từ file MP3 của chú... Vui lòng đợi...";
    const audioFile = fileSelector.files[0];
    
    try {
        const response = await fetch("https://huggingface.co", {
            method: "POST",
            body: audioFile,
        });
        const data = await response.json();
        outputArea.value = data.text || "AI đã chạy xong nhưng không nhận diện được giọng nói trong file.";
    } catch (err) {
        outputArea.value = "Lỗi kết nối máy chủ API! Chú kiểm tra lại mạng internet của chú nhé.";
    }
}
</script>
</body>
</html>
