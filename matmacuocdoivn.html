<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web Của Tôi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            /* Nền màu xám nhạt để làm nổi bật khung nội dung */
            background-color: #f4f4f9; 
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { color: #333; }
        p { color: #666; }
        
        /* Cấu hình nút bấm dòng link */
        .dong-link {
            display: block;
            /* Đổi sang màu Đỏ Đô sang trọng */
            background-color: #900c3f; 
            /* Chữ trên nút màu trắng cho dễ đọc */
            color: white; 
            padding: 15px;
            margin: 10px 0;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            /* Hiệu ứng mượt mà khi đổi màu */
            transition: background-color 0.3s ease; 
        }
        
        /* Khi rê chuột hoặc bấm vào nút sẽ đổi sang màu Xanh Dương */
        .dong-link:hover { 
            background-color: #0056b3; 
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Xin chào, tôi là Nguyễn Văn A</h1>
        <p>Chào mừng bác đến với trang tổng hợp liên kết của tôi.</p>

        <!-- Bác cứ thoải mái copy và dán thêm các dòng link ở dưới này nhé -->
        <a class="dong-link" href="https://facebook.com" target="_blank">Xem Facebook của tôi</a>
        <a class="dong-link" href="https://youtube.com" target="_blank">Kênh Youtube tôi yêu thích</a>
        <a class="dong-link" href="https://zalo.me" target="_blank">Liên hệ qua Zalo</a>
    </div>

</body>
</html>
