<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công Cụ Tra Cứu Sim Phong Thủy Chuyên Sâu</title>
    <style>
        body { background-color: #20373b; color: #fff; font-family: Arial, sans-serif; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 550px; margin: 30px auto; background: rgba(255, 255, 255, 0.05); padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 1px solid #d4af37; }
        h1 { color: #d4af37; font-size: 24px; margin-bottom: 5px; text-shadow: 1px 1px 2px #000; }
        .subtitle { color: #bbb; font-size: 13px; margin-bottom: 25px; }
        
        .form-group { margin-bottom: 15px; text-align: left; width: 90%; margin-left: auto; margin-right: auto; }
        label { display: block; font-size: 14px; color: #d4af37; margin-bottom: 5px; font-weight: bold; }
        
        input[type="text"], select { width: 100%; padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #d4af37; background-color: #1a2c30; color: #fff; box-sizing: border-box; }
        .row { display: flex; gap: 10px; }
        .row select, .row input { flex: 1; }
        
        .radio-group { display: flex; gap: 20px; padding: 8px 0; }
        .radio-group label { display: inline-flex; align-items: center; font-weight: normal; color: #fff; cursor: pointer; }
        .radio-group input { margin-right: 8px; accent-color: #d4af37; }
        
        button { width: 90%; background-color: #d4af37; color: #20373b; padding: 12px 0; font-size: 18px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s; margin-top: 15px; }
        button:hover { background-color: #fff; }
        
        .process-box { margin-top: 20px; background: rgba(212, 175, 55, 0.1); padding: 12px; border-radius: 5px; border-left: 4px solid #d4af37; text-align: left; font-size: 14px; display: none; width: 90%; margin-left: auto; margin-right: auto; }
        .result { margin-top: 25px; text-align: left; background: rgba(0, 0, 0, 0.3); padding: 15px; border-radius: 8px; display: none; width: 90%; margin-left: auto; margin-right: auto; }
        .pair-item { margin-bottom: 12px; padding: 10px; border-bottom: 1px dashed rgba(255,255,255,0.1); font-size: 16px; }
        .cat { color: #4caf50; font-weight: bold; }
        .hung { color: #f44336; font-weight: bold; }
        .kick-phat { background: #ff9800; color: #000; padding: 2px 6px; border-radius: 3px; font-weight: bold; font-size: 11px; display: inline-block; margin-left: 5px; animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>XEM PHONG THỦY SIM SỐ</h1>
        <div class="subtitle">Hệ thống nghiệm lý Bát Cực Linh Số - Bản quyền cá nhân</div>
        
        <!-- Nhập số điện thoại -->
        <div class="form-group">
            <label for="phoneInput">Nhập số cần xem/mua</label>
            <input type="text" id="phoneInput" placeholder="Ví dụ: 0789414153" maxlength="15">
        </div>

        <!-- Nhập ngày tháng năm sinh -->
        <div class="form-group">
            <label>Ngày tháng năm sinh</label>
            <div class="row">
                <input type="text" id="birthDay" placeholder="Ngày (1-31)" maxlength="2">
                <input type="text" id="birthMonth" placeholder="Tháng (1-12)" maxlength="2">
                <input type="text" id="birthYear" placeholder="Năm (Ví dụ: 1970)" maxlength="4">
            </div>
        </div>

        <!-- Nhập giờ sinh -->
        <div class="form-group">
            <label>Giờ sinh</label>
            <div class="row">
                <input type="text" id="birthHour" placeholder="Giờ (0-23)" maxlength="2">
                <input type="text" id="birthMinute" placeholder="Phút (0-59)" maxlength="2">
            </div>
        </div>

        <!-- Chọn loại lịch -->
        <div class="form-group">
            <label>Loại lịch</label>
            <div class="radio-group">
                <label><input type="radio" name="calendarType" value="dl" checked> Dương Lịch</label>
                <label><input type="radio" name="calendarType" value="al"> Âm Lịch</label>
            </div>
        </div>

        <!-- Chọn giới tính -->
        <div class="form-group">
            <label>Giới tính</label>
            <div class="radio-group">
                <label><input type="radio" name="gender" value="nam" checked> Nam</label>
                <label><input type="radio" name="gender" value="nu"> Nữ</label>
            </div>
        </div>

        <button onclick="tinhPhongThuySim()">TÌM SIM HỢP TUỔI</button>

        <!-- Khung hiển thị tiến trình -->
        <div class="process-box" id="processBox"></div>

        <!-- Khung hiển thị kết quả -->
        <div class="result" id="resultBox">
            <h3 style="color: #d4af37; text-align: center; margin-top: 0; border-bottom: 1px solid #d4af37; padding-bottom: 10px;">
                KẾT QUẢ LUẬN GIẢI NĂNG LƯỢNG SỐ
            </h3>
            <div id="resultContent"></div>
        </div>
    </div>

    <script>
        const batTinhData = {
            "Sinh Khí": { pairs: ["14", "41", "67", "76", "39", "93", "28", "82"], type: "cat", yNghia: "Tốt cho tài lộc, danh tiếng, quý nhân phù trợ." },
            "Thiên Y": { pairs: ["13", "31", "68", "86", "49", "94", "27", "72"], type: "cat", yNghia: "Tốt cho sức khỏe, tiền tài, tích lũy tài sản." },
            "Diên Niên": { pairs: ["19", "91", "78", "87", "34", "43", "26", "62"], type: "cat", yNghia: "Tốt cho sự nghiệp vững vàng, gia đạo êm ấm, thọ mệnh." },
            "Phục Vị": { pairs: ["11", "22", "33", "44", "66", "77", "88", "99"], type: "cat", yNghia: "Bình hòa, mang tính chất kế thừa, ổn định, kiên trì." },
            "Tuyệt Mệnh": { pairs: ["12", "21", "69", "96", "48", "84", "37", "73"], type: "hung", yNghia: "Xấu. Dễ hao tài, tranh chấp, ảnh hưởng tinh thần." },
            "Ngũ Quỷ": { pairs: ["18", "81", "79", "97", "36", "63", "24", "42"], type: "hung", yNghia: "Xấu. Tai bay vạ gió, trắc trở, tâm tư bất an." },
            "Lục Sát": { pairs: ["16", "61", "47", "74", "38", "83", "29", "92"], type: "hung", yNghia: "Xấu. Thị phi tai tiếng, tình duyên trắc trở." },
            "Họa Hại": { pairs: ["17", "71", "89", "98", "46", "64", "23", "32"], type: "hung", yNghia: "Xấu. Bị gièm pha, khó thành việc lớn, dễ mất mát nhỏ." }
        };

        function timSao(caiCap) {
            for (let sao in batTinhData) {
                if (batTinhData[sao].pairs.includes(caiCap)) {
                    return { tenSao: sao, loai: batTinhData[sao].type, yNghia: batTinhData[sao].yNghia };
                }
            }
            return { tenSao: "Chưa định nghĩa", loai: "binh", yNghia: "Cặp số phụ hoặc từ trường phụ." };
        }

        function tinhPhongThuySim() {
            let rawPhone = document.getElementById("phoneInput").value.trim();
            rawPhone = rawPhone.replace(/[^0-9]/g, '');

            // Lấy thêm thông tin cá nhân để chuẩn bị cho việc nghiệm lý nâng cao sau này
            let d = document.getElementById("birthDay").value.trim();
            let m = document.getElementById("birthMonth").value.trim();
            let y = document.getElementById("birthYear").value.trim();
            let gender = document.querySelector('input[name="gender"]:checked').value;
            let calType = document.querySelector('input[name="calendarType"]:checked').value === "dl" ? "Dương Lịch" : "Âm Lịch";

            if (rawPhone.length < 5) { 
                alert("Chú vui lòng nhập đầy đủ số điện thoại nhé!"); 
                return; 
            }

            let xửLýSố = rawPhone;
            if (xửLýSố.startsWith('0')) { xửLýSố = xửLýSố.substring(1); }

            let chuỗiKhôngCóKhông = "";
            for (let ch of xửLýSố) { if (ch !== '0') { chuỗiKhôngCóKhông += ch; } }

            // Hiển thị thông tin tổng hợp cho chú kiểm tra
            let thongTinGiaoDien = `<strong>Thông tin gia chủ:</strong> Sinh ngày ${d}/${m}/${y} (${calType}) - Giới tính: ${gender === 'nam' ? 'Nam' : 'Nữ'}<br>`;
            let dòngQuyTrình = `${thongTinGiaoDien}<strong>Quy trình lọc số:</strong><br>➔ Số gốc: ${rawPhone}<br>➔ Sau khi loại bỏ toàn bộ số 0: <strong>${chuỗiKhôngCóKhông}</strong>`;
            
            document.getElementById("processBox").innerHTML = dòngQuyTrình;
            document.getElementById("processBox").style.display = "block";

            let htmlContent = "";
            let i = 0;

            while (i < chuỗiKhôngCóKhông.length - 1) {
                if (chuỗiKhôngCóKhông[i] === '5') { i++; continue; }
                let vịTríKế = i + 1;
                let cóSốNămGiữa = false;
                let cóSốNămSau = false;

                while (vịTríKế < chuỗiKhôngCóKhông.length && chuỗiKhôngCóKhông[vịTríKế] === '5') {
                    cóSốNămGiữa = true;
                    vịTríKế++;
                }
                if (vịTríKế >= chuỗiKhôngCóKhông.length) { break; }

                let capSo = chuỗiKhôngCóKhông[i] + chuỗiKhôngCóKhông[vịTríKế];
                if (vịTríKế + 1 < chuỗiKhôngCóKhông.length && chuỗiKhôngCóKhông[vịTríKế + 1] === '5') { cóSốNămSau = true; }

                let ketQuaSao = timSao(capSo);
                let mauSacClass = ketQuaSao.loai === "cat" ? "cat" : (ketQuaSao.loai === "hung" ? "hung" : "");
                let nhãnLoai = ketQuaSao.loai === "cat" ? "[CÁT]" : (ketQuaSao.loai === "hung" ? "[HUNG]" : "[BÌNH]");
                
                let textKíchPhat = "";
                let lờiGiảiThíchKíchPhat = "";
                if (cóSốNămGiữa || cóSốNămSau || chuỗiKhôngCóKhông[i-1] === '5') {
                    textKíchPhat = `<span class="kick-phat">KÍCH PHÁT MẠNH X2</span>`;
                    if (ketQuaSao.loai === "cat") {
                        lờiGiảiThíchKíchPhat = `<br><small style="color: #4caf50;">➔ Nhờ tác động của số 5, từ trường TỐT được nhân lên gấp đôi, trợ lực cực mạnh cho gia chủ.</small>`;
                    } else if (ketQuaSao.loai === "hung") {
                        lờiGiảiThíchKíchPhat = `<br><small style="color: #f44336;">➔ Cảnh báo: Số 5 kích hoạt làm hung tinh mạnh lên gấp đôi, cần đặc biệt lưu ý hung hiểm!</small>`;
                    }
                }

                htmlContent += `
                    <div class="pair-item">
                        Cặp số thực tế: <strong>${capSo}</strong> ➔ Thuộc sao: <span class="${mauSacClass}">${ketQuaSao.tenSao} ${nhãnLoai}</span> ${textKíchPhat}
                        <br><small style="color: #bbb;">➔ Gốc: ${ketQuaSao.yNghia}</small>
                        ${lờiGiảiThíchKíchPhat}
                    </div>`;
                i = vịTríKế;
            }
            document.getElementById("resultContent").innerHTML = htmlContent;
            document.getElementById("resultBox").style.display = "block";
        }
    </script>
</body>
</html>
