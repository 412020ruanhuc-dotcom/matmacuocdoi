<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MẬT MÃ CUỘC ĐỜI</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body{font-family:Arial;background:#f3f4f6}

.card{
  background:#fff;
  border-radius:16px;
  margin-bottom:14px;
  padding:16px;
  border:1px solid #e5e7eb;
  box-shadow:0 6px 16px rgba(0,0,0,0.05);
}

.title{text-align:center;font-weight:900;font-size:22px}

.sub{text-align:center;color:#b91c1c;font-weight:700;margin-top:5px}

.item{
  display:flex;
  align-items:center;
  padding:12px;
  border-left:6px solid #ddd;
  margin-top:10px;
}

.item i{width:40px;text-align:center;font-size:22px}

.btn{
  background:white;
  padding:12px;
  border-radius:12px;
  font-weight:900;
  width:100%;
}

.hidden{display:none}
</style>
</head>

<body>

<div style="max-width:420px;margin:auto;padding:10px">

<!-- HEADER -->
<div class="card">
  <div class="title">MẬT MÃ CUỘC ĐỜI</div>
  <div class="sub">TỬ VI - NĂNG LƯỢNG SỐ</div>
</div>

<!-- TRA SAO HẠN -->
<div class="card" style="text-align:center;background:linear-gradient(90deg,#b91c1c,#1d4ed8);color:white">
  <h2 style="font-weight:900">TRA SAO HẠN</h2>
  <button class="btn">NHẤN ĐỂ TRA CỨU</button>
</div>

<!-- CỘNG ĐỒNG -->
<div class="card">

  <div style="text-align:center;font-weight:900">CỘNG ĐỒNG</div>

  <div class="item">
    <i class="fa-brands fa-youtube" style="color:red"></i>
    <b>YOUTUBE</b>
  </div>

  <div class="item">
    <i class="fa-brands fa-tiktok"></i>
    <b>TIKTOK 1</b>
  </div>

  <div class="item">
    <i class="fa-brands fa-tiktok"></i>
    <b>TIKTOK 2</b>
  </div>

  <div class="item">
    <i class="fa-solid fa-comments" style="color:green"></i>
    <b>ZALO</b>
  </div>

  <div class="item">
    <i class="fa-brands fa-facebook" style="color:blue"></i>
    <b>FACEBOOK</b>
  </div>

</div>

<!-- CHUYÊN GIA -->
<div class="card">

  <div style="text-align:center;font-weight:900">ĐỘI NGŨ CHUYÊN GIA</div>

  <div class="item">
    <i class="fa-solid fa-user" style="color:green"></i>
    <b>ZALO CHUYÊN GIA</b>
  </div>

  <div class="item">
    <i class="fa-solid fa-user" style="color:blue"></i>
    <b>FACEBOOK CHUYÊN GIA</b>
  </div>

</div>

</div>

</body>
</html>
